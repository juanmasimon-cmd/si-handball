/* Réplica web de la app iOS «Si Handball»: estética Liquid Glass sobre FondoAmbiente (marino + naranja de la marca SH 27) */
:root{
  --marino:#082546; --naranja:#FEA50E;
  --acento:#0B3B78;
  --blue:#007AFF; --red:#FF3B30; --green:#34C759; --orange:#FF9500; --indigo:#5856D6; --purple:#AF52DE; --yellow:#FFCC00; --gray:#8E8E93;
  --amarilloTarjeta:#EDB00D;
  --bg:#FFFFFF; --grouped:#F2F2F7; --surface2:#FFFFFF; --sys2:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(0,0,0,.06);
  --glass:rgba(255,255,255,.58); --glass-brd:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9);
  --glass-shadow:0 6px 22px rgba(8,37,70,.10);
  --row:rgba(255,255,255,.55);
  --sheet:#F2F2F7;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rPanel:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --acento:#5994EB;
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --indigo:#5E5CE6; --purple:#BF5AF2; --yellow:#FFD60A; --gray:#8E8E93;
  --bg:#000000; --grouped:#000000; --surface2:#1C1C1E; --sys2:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(255,255,255,.08);
  --glass:rgba(44,44,50,.50); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.18);
  --glass-shadow:0 6px 22px rgba(0,0,0,.35);
  --row:rgba(40,40,46,.55);
  --sheet:#0B0B0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --acento:#5994EB;
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --indigo:#5E5CE6; --purple:#BF5AF2; --yellow:#FFD60A; --gray:#8E8E93;
  --bg:#000000; --grouped:#000000; --surface2:#1C1C1E; --sys2:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(255,255,255,.08);
  --glass:rgba(44,44,50,.50); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.18);
  --glass-shadow:0 6px 22px rgba(0,0,0,.35);
  --row:rgba(40,40,46,.55);
  --sheet:#0B0B0D; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--f-ui);font-size:17px;line-height:1.29;letter-spacing:-.01em;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}

:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--label)}
svg{flex:none}
.r{font-family:var(--f-round)}
.mono{font-family:var(--f-mono)}
.tn{font-variant-numeric:tabular-nums}
.sec{color:var(--label2)} .ter{color:var(--label3)}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-indigo{color:var(--indigo)} .c-naranja{color:var(--naranja)} .c-acento{color:var(--acento)} .c-yellow{color:var(--yellow)}
.f-title{font-size:28px;font-weight:700} .f-title2{font-size:22px} .f-title3{font-size:20px} .f-head{font-size:17px;font-weight:600}
.f-sub{font-size:15px} .f-foot{font-size:13px} .f-cap{font-size:12px} .f-cap2{font-size:11px}
.b{font-weight:700} .sb{font-weight:600} .blk{font-weight:900} .hv{font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{text-align:center}

/* ---------- Fondo ambiente ---------- */
.amb{position:absolute;inset:0;pointer-events:none;z-index:0;--tono:var(--acento);
  background:
   radial-gradient(380px 380px at 0 0,color-mix(in srgb,var(--tono) 32%,transparent),transparent 100%),
   radial-gradient(380px 380px at 100% 100%,color-mix(in srgb,var(--naranja) 20%,transparent),transparent 100%),
   linear-gradient(135deg,color-mix(in srgb,var(--tono) 28%,var(--bg)) 0%,color-mix(in srgb,var(--marino) 16%,var(--bg)) 50%,var(--bg) 100%);}
.amb.fixed{position:fixed}
body.pab .amb{background:var(--grouped)}
.t-blue{--tono:var(--blue)} .t-red{--tono:var(--red)} .t-indigo{--tono:var(--indigo)} .t-orange{--tono:var(--orange)}

/* ---------- Estructura ---------- */
#app{position:relative;min-height:100%}
.screen{position:relative;min-height:100vh;min-height:100dvh}
.screen>.content{position:relative;z-index:1}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.stack12{display:flex;flex-direction:column;gap:12px}
.stack10{display:flex;flex-direction:column;gap:10px}
.stack8{display:flex;flex-direction:column;gap:8px}

/* Barra de navegación */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:transparent}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;min-height:54px;padding-block:6px}
.navbar .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;min-width:0}
.navbar .side{display:flex;gap:8px;min-width:44px}
.navbar .side.r8{justify-content:flex-end}
.largetitle{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px;text-wrap:balance}

/* ---------- Cristal ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-brd);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.panel{border-radius:var(--rPanel);padding:16px}
.panel.p12{padding:12px} .panel.p14{padding:14px} .panel.p10{padding:10px}
.panel.tint{background:color-mix(in srgb,var(--tinte) 22%,var(--glass))}

body.pab .panel.tint{background:color-mix(in srgb,var(--tinte) 16%,var(--surface2))}
.divider{height:1px;background:var(--sep);border:0;margin:0}

/* Botones de barra (circulares) */
.cbtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:var(--label)}
.cbtn svg{width:20px;height:20px}
.cbtn:disabled{opacity:.35}
.cgroup{display:flex;border-radius:999px;padding:0 4px}
.cgroup .cbtn{width:40px}
.tbtn{height:44px;border-radius:999px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--label);white-space:nowrap}
.tbtn.bold{font-weight:700}
.tbtn.prom{background:var(--acento);color:#fff;border-color:transparent}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;color:var(--acento);min-height:40px}
.btn svg{width:18px;height:18px}
.btn.lg{padding:14px 20px;font-size:17px;min-height:52px}
.btn.sm{padding:6px 12px;font-size:13px;min-height:30px}
.btn.wfull{width:100%}
.btn.prom{--tint:var(--acento);background:var(--tint);color:#fff;border:1px solid color-mix(in srgb,#fff 25%,var(--tint));box-shadow:0 4px 14px color-mix(in srgb,var(--tint) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.prom:disabled{background:color-mix(in srgb,var(--label) 14%,transparent);color:var(--label3);box-shadow:none;border-color:transparent}
.btn.gl{--tint:var(--acento);color:var(--tint)}
.btn.gl.danger{color:var(--red)}
.btn:active:not(:disabled),.press:active:not(:disabled){transform:scale(.96);opacity:.85}
.btn,.press{transition:transform .08s ease-out,opacity .08s ease-out}

/* BotonCristal */
.bc{--c:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:64px;border-radius:22px;color:#fff;padding:6px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));border:1px solid color-mix(in srgb,#fff 28%,var(--c));
  box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.bc .t{display:flex;align-items:center;gap:8px;font-family:var(--f-round);font-weight:800;font-size:17px;text-align:center;line-height:1.15}
.bc .t svg{width:20px;height:20px}
.bc .s{font-size:11px;opacity:.85}
body.pab .bc{background:var(--c);box-shadow:none}

/* BotonJugador */
.bj{--c:transparent;display:flex;align-items:center;width:100%;min-height:52px;border-radius:16px;color:var(--label)}
.bj.tint2{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c));color:#fff;border:1px solid color-mix(in srgb,#fff 25%,var(--c));box-shadow:0 3px 10px color-mix(in srgb,var(--c) 28%,transparent)}
.bj.v{flex-direction:column;justify-content:center;gap:1px;padding:4px 6px}
.bj.v .d{font-family:var(--f-round);font-weight:900;font-size:22px;line-height:1.05}
.bj.v .n{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bj.h{gap:8px;padding:0 10px;text-align:left}
.bj.h .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-round);font-weight:700;font-size:16px;background:color-mix(in srgb,currentColor 15%,transparent);flex:none}
.bj.h .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bj:disabled{opacity:.55}

/* Insignia */
.ins{--c:var(--acento);--s:34px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 95%,transparent),color-mix(in srgb,var(--c) 70%,transparent))}
.ins svg{width:calc(var(--s)*.5);height:calc(var(--s)*.5)}

/* Etiqueta de sección */
.etq{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--label2)}
.etq svg{width:14px;height:14px;color:var(--naranja)}

/* FilaMetrica */
.fm{display:flex;align-items:center;gap:10px;min-height:24px}
.fm .v{margin-left:auto;font-family:var(--f-round);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* Píldora de estado */
.pil{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 8px;font-size:12px;min-width:0}
.pil svg{width:16px;height:16px}
.pil .v{font-family:var(--f-round);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
body.pab .pil{font-size:15px;font-weight:600}

/* Selector segmentado */
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;padding:7px 6px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface2);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}

/* Interruptor */
.sw{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--fill);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw input:checked+i{background:var(--sw,var(--acento))}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--acento);outline-offset:2px}

/* Menú (Picker .menu) */
.menu{position:relative;display:inline-flex;align-items:center;gap:4px;color:var(--acento);font-weight:400;max-width:62%;justify-content:flex-end}
.menu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu svg{width:12px;height:12px}
.menu select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.menu.sec{color:var(--label2)}

/* Campo de texto */
.tf{width:100%;border:0;border-radius:14px;padding:12px;background:var(--fill2);outline:none;font-size:17px}
.tf:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--acento) 50%,transparent)}
.tf.rb{border:1px solid var(--sep);border-radius:8px;padding:7px 9px;background:var(--surface2);font-size:15px}
.tf.plain{background:transparent;padding:0;border-radius:0;box-shadow:none!important}

/* Stepper */
.stp{display:flex;border-radius:999px;background:var(--fill);overflow:hidden;flex:none}
.stp button{width:46px;height:32px;display:grid;place-items:center}
.stp button+button{border-left:1px solid var(--sep)}
.stp svg{width:16px;height:16px}

/* ---------- Formularios (List / Form) ---------- */
.form{display:flex;flex-direction:column;gap:22px;padding-bottom:20px}
.fsec .fh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--label2);padding:0 16px 7px}
.fsec .fh svg{width:15px;height:15px}
.fsec .ff{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.35}
.fbox{border-radius:22px;overflow:hidden;background:var(--row);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
body.pab .fbox{background:var(--surface2);-webkit-backdrop-filter:none;backdrop-filter:none}
.frow{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px}
.frow+.frow,.fbox>*+*{border-top:.5px solid var(--sep)}
.frow.tap{width:100%;text-align:left}
.frow .chev{color:var(--label3);width:14px;height:14px;margin-left:auto}
.frow.btnrow{color:var(--acento)}
.frow.btnrow.red{color:var(--red)}
.frow.btnrow:disabled{color:var(--label3)}
.frow.btnrow svg{width:20px;height:20px}

/* Deslizar para borrar */
.swipe{position:relative;overflow:hidden}
.swipe>.sw-act{position:absolute;top:0;right:0;bottom:0;width:96px;background:var(--red);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.swipe>.sw-act svg{width:18px;height:18px}
.swipe>.sw-body{position:relative;background:inherit;transition:transform .2s ease-out;touch-action:pan-y}
.fbox .swipe>.sw-body{background:transparent}
.swipe.dragging>.sw-body{transition:none}
.swipe:not(.dragging):not(.open)>.sw-act{visibility:hidden}

/* Disclosure */
.disc .dhead{width:100%;text-align:left}
.disc .dchev{width:14px;height:14px;color:var(--acento);transition:transform .2s;margin-left:auto}
.disc.open .dchev{transform:rotate(90deg)}
.disc .dbody{padding:4px 16px 14px}

/* ---------- Barra de pestañas ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;width:min(340px,100%)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px 5px;border-radius:999px;font-size:10px;font-weight:600;color:var(--label)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--acento);background:var(--fill)}
.pad-tab{height:calc(90px + env(safe-area-inset-bottom,0px))}

/* ---------- Hojas ---------- */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;overflow:hidden;background:var(--sheet);box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet.lvl2{top:calc(env(safe-area-inset-top,0px) + 22px)}
.sheet .amb{position:absolute}
.sh-head{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-left,0px)) 6px;max-width:680px;width:100%;margin:0 auto}
.sh-head .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .side{min-width:64px;display:flex}
.sh-head .side.r8{justify-content:flex-end}
.sh-body{position:relative;z-index:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sh-foot{position:relative;z-index:2;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));max-width:680px;width:100%;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;position:relative;z-index:2}
.full{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:var(--bg)}
.full .sh-body{position:relative;z-index:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){
  .anim-up{animation:up .28s cubic-bezier(.2,.9,.25,1)}
  .anim-fade{animation:fade .18s ease-out}
  @keyframes up{from{transform:translateY(100%)}}
  @keyframes fade{from{opacity:0}}
  .pulse{animation:pulse .6s ease-out}
  @keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.06);box-shadow:0 0 0 4px var(--naranja)}100%{transform:scale(1)}}
}

/* Diálogo de confirmación */
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35)}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:71;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.dlg .box{border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--surface2) 88%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.dlg .hd{padding:14px 16px 12px;text-align:center;font-size:13px;color:var(--label2)}
.dlg .hd b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.dlg .op{display:block;width:100%;padding:16px;text-align:center;font-size:19px;color:var(--acento);border-top:.5px solid var(--sep)}
.dlg .op.red{color:var(--red)}
.dlg .op.cancel{font-weight:600;border-top:0}
.alert{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:71;width:min(290px,calc(100% - 40px));border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--surface2) 92%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);text-align:center}
.alert .hd{padding:18px 16px 12px}
.alert .hd b{display:block;font-size:17px;margin-bottom:4px}
.alert .hd p{margin:0;font-size:13px}
.alert .ops{display:flex;border-top:.5px solid var(--sep)}
.alert .ops button{flex:1;padding:12px;color:var(--acento);font-size:17px}
.alert .ops button+button{border-left:.5px solid var(--sep);font-weight:600}

/* Aviso flotante */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* ---------- Partido ---------- */
.match .content{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.zinf{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 70%,transparent) 30%)}
.zinf .wrap{display:flex;flex-direction:column;gap:8px}
.mesa{display:flex;gap:8px}
.mesa button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 6px;font-size:13px;font-weight:700;color:var(--c)}
.mesa svg{width:16px;height:16px}
.cabreg{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;padding:0 8px}
.cabreg .p{letter-spacing:.12em}
.cabreg span{display:inline-flex;align-items:center;gap:4px}
.cabreg svg{width:14px;height:14px}
.reloj{font-family:var(--f-round);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
body.pab .reloj{font-size:60px;font-weight:800}
.to{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}
.to i{width:11px;height:11px;border-radius:50%;border:1px solid color-mix(in srgb,var(--label) 35%,transparent)}
.casilla{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:20px;transition:transform .15s}
.casilla .n{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.casilla .g{font-family:var(--f-round);font-weight:900;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
body.pab .casilla .g{font-size:68px}
.playbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;border:1px solid rgba(255,255,255,.3);box-shadow:0 5px 16px color-mix(in srgb,var(--c) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.4);background:var(--c)}
.playbtn svg{width:24px;height:24px}
.situ{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:8px;color:#fff;font-size:15px;font-weight:800;letter-spacing:.05em}
.situ svg{width:18px;height:18px}
.fex{display:flex;align-items:center;gap:12px}
.fex .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--f-round);font-weight:900;font-size:14px;flex:none}
.fex .t{margin-left:auto;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:4px 10px;border-radius:999px}

/* Alineación */
.tit7{display:flex;gap:4px}
.tit7>*{flex:1;min-width:0}
.ficha{--c:transparent;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border-radius:14px;padding:2px;color:var(--label);transition:transform .15s,opacity .15s}
.ficha.col{background:var(--c);color:#fff;border:1px solid color-mix(in srgb,#fff 25%,var(--c))}
.ficha .d{display:flex;align-items:center;gap:2px;font-family:var(--f-round);font-weight:900;font-size:20px;line-height:1}
.ficha .d svg{width:10px;height:10px}
.ficha .n{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha.big{min-height:96px}
.ficha.big .d{font-size:34px}
.ficha.big .d svg{width:14px;height:14px}
.ficha.big .n{font-size:13px}
.ficha.marcada{transform:scale(1.1);box-shadow:0 0 0 4px var(--yellow),0 0 14px color-mix(in srgb,var(--yellow) 80%,transparent);z-index:1}
.ficha.candidata{box-shadow:0 0 0 3px var(--green)}
.ficha.atenuada{opacity:.4}
.ficha .badge{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.ficha .badge svg{width:10px;height:10px}
.hueco{min-height:60px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--label2) 75%,transparent);display:grid;place-items:center;color:var(--label2)}
.hueco svg{width:12px;height:12px}
.hueco.big{min-height:96px}
.supl{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.supl::-webkit-scrollbar{display:none}
.supl .ficha{width:62px;flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gridA{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.gridD{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.gridN{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px}
.banner-cambio{display:flex;align-items:center;gap:10px;background:var(--yellow);color:#000;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700}

.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--label2)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* Asistentes */
.flow{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.flow .fbody{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.cabflujo{position:relative;z-index:1;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
.cabflujo .top{display:flex;align-items:center}
.cabflujo .top>button{min-width:90px;min-height:44px;display:flex;align-items:center;gap:4px;font-weight:600;color:var(--c)}
.cabflujo .top>button svg{width:20px;height:20px}
.cabflujo .top .x{justify-content:flex-end;color:var(--label2)}
.cabflujo .top .x svg{width:26px;height:26px}
.cabflujo .t{flex:1;text-align:center;font-weight:600;font-size:17px}
.prog{display:flex;gap:6px;margin-top:10px}
.prog i{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--label) 15%,transparent)}
.prog i.on{background:var(--c)}
.goal{height:300px;display:flex;flex-direction:column}
.goal .lar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--label) 85%,transparent);margin:0 -6px}
.goal .mid{flex:1;display:flex}
.goal .poste{width:12px;border-radius:6px;background:color-mix(in srgb,var(--label) 85%,transparent)}
.goal .red{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:8px;border-radius:6px;
  background-color:color-mix(in srgb,var(--sys2) 35%,transparent);
  background-image:linear-gradient(to right,color-mix(in srgb,var(--label) 8%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--label) 8%,transparent) 1px,transparent 1px);background-size:26px 22px}
.cz{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label)}
.cz b{font-family:var(--f-round);font-size:20px}
.cz span{font-size:11px;font-weight:600}
.cz.mid{background:color-mix(in srgb,var(--orange) 35%,var(--glass))}
.courtwrap{position:relative;width:100%;aspect-ratio:320/300;max-width:100%;border-radius:16px;overflow:hidden;border:2px solid color-mix(in srgb,var(--label) 35%,transparent)}
.courtwrap svg.pista{position:absolute;inset:0;width:100%;height:100%}
.znode{position:absolute;transform:translate(-50%,-50%);width:64px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--zc);
  background:color-mix(in srgb,var(--zc) 30%,var(--glass));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.znode b{font-family:var(--f-round);font-weight:900;font-size:17px;line-height:1}
.znode span{font-size:7.5px;font-weight:700;letter-spacing:.04em}

/* Mapas de calor */
.hgoal{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;border-radius:6px;background:color-mix(in srgb,var(--label) 5%,transparent);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--label) 75%,transparent);margin:0 6px;border:5px solid color-mix(in srgb,var(--label) 75%,transparent)}
.hcell{min-height:66px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.hcell b{font-family:var(--f-round);font-size:20px}
.hcell span{font-size:11px;font-weight:500}
.hcourt{position:relative;width:320px;max-width:100%;aspect-ratio:320/300;margin:0 auto;border-radius:16px;overflow:hidden;border:2px solid color-mix(in srgb,var(--label) 35%,transparent)}
.hcourt>svg{position:absolute;inset:0;width:100%;height:100%}
.hmark{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px}
.hmark b{width:42px;height:24px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-round);font-weight:800;font-size:12px}
.hmark span{font-size:9px;font-weight:700;color:color-mix(in srgb,var(--label) 70%,transparent)}
.hleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--label2)}
.hleg i{width:70px;height:8px;border-radius:4px;background:linear-gradient(to right,hsl(50.4,100%,54%),hsl(25.2,100%,54%),hsl(0,100%,54%))}

/* Tarjeta resumen (siempre clara, como la imagen compartida) */
.tres{background:#fff;color:#000;border-radius:26px;overflow:hidden;color-scheme:light}
.tres .cab{color:#fff;padding:18px 14px;text-align:center;background:linear-gradient(135deg,#082546,#123D73);border-bottom:4px solid #FEA50E}
.tres .cab .sc{font-family:var(--f-round);font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tres .tit{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8E8E93}
.tres .tit svg{width:14px;height:14px}
.tres .fl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.tres .fl b{font-family:var(--f-round);font-variant-numeric:tabular-nums}
.tres .pie{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#082546;color:rgba(255,255,255,.9);font-size:12px}
.caja{flex:1;border-radius:14px;padding:10px 4px;text-align:center}

/* Tablas de eficacia */
.tef .h,.tef .r{display:grid;grid-template-columns:1fr 92px 92px;align-items:center}
.tef .h{font-size:11px;font-weight:700;color:var(--label2);text-align:right}
.tef .cell{text-align:right;font-variant-numeric:tabular-nums}
.tef .cell b{display:block;font-family:var(--f-round);font-size:15px}
.tef .cell span{font-size:11px;color:var(--label2)}

/* Guía */
.guide{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--bg)}
.guide .gtop{position:relative;z-index:1;display:flex;align-items:center;min-height:44px;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.guide .gpage{position:relative;z-index:1;flex:1;overflow-y:auto;touch-action:pan-y}
.gil{min-height:230px;padding:16px;border-radius:28px;background:color-mix(in srgb,var(--sys2) 85%,transparent);border:1.5px solid color-mix(in srgb,var(--naranja) 35%,transparent);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.gdots{display:flex;gap:7px;justify-content:center;padding:12px 0}
.gdots i{width:7px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--label) 20%,transparent);transition:width .2s}
.gdots i.on{width:22px;background:var(--naranja)}
.gpoint{display:flex;gap:8px;align-items:baseline;font-size:15px}
.gpoint svg{width:16px;height:16px;color:var(--naranja);transform:translateY(3px)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:var(--c)}
.pill svg{width:13px;height:13px}

.loading.out{opacity:0;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid color-mix(in srgb,var(--naranja) 25%,transparent);border-top-color:var(--naranja);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{display:block;object-fit:cover;flex:none}

.empty{color:var(--label2);font-size:15px}
.chip-n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--f-round);font-weight:700;font-size:13px;flex:none}
.capsule{display:inline-block;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--label) 8%,transparent);font-size:12px;font-weight:700}
.cdot{width:34px;height:34px;border-radius:50%;margin:3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--label) 18%,transparent)}
.cdot.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--label) 90%,transparent)}
.warn{display:flex;gap:6px;align-items:flex-start;font-size:12px;font-weight:600;color:var(--orange)}
.warn svg{width:14px;height:14px;transform:translateY(1px)}
.pbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--blue));transition:width 1s linear}
.chartbox{width:100%;overflow:hidden}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--label2);font-size:10px;font-family:var(--f-ui)}
@media (min-width:600px){.grid4.big5{grid-template-columns:repeat(5,1fr)}}
.etq{white-space:nowrap}
.btn{white-space:nowrap}
.supl .ficha{width:calc((100% - 24px) / 7);min-width:44px;flex:none}
.ficha.big,.hueco.big{min-height:0;aspect-ratio:1/1.05}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipo{border-radius:14px;padding:11px 4px;font-weight:700;font-size:14px;color:var(--c);border:1px solid transparent}
.tipo.on{background:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}

.tres{--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--fill2:rgba(0,0,0,.06);--blue:#007AFF;--indigo:#5856D6;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--naranja:#FEA50E}
.tabbar.mini .in{width:auto;padding:3px}
.tabbar.mini button{flex-direction:row;gap:6px;padding:7px 14px;font-size:12px}
.tabbar.mini button svg{width:18px;height:18px}
.zinf{bottom:calc(52px + env(safe-area-inset-bottom,0px))!important;padding-bottom:6px!important}
.match .content{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
.zinf{z-index:26}

/* Compatibilidad con las copias de seguridad de la app de iPhone (JSONEncoder de Swift:
   fechas en segundos desde el 1-1-2001 y claves opcionales omitidas). */
var REF2001=978307200000;
function limpio(o){if(Array.isArray(o))return o.map(limpio);if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){if(o[k]!=null&&k!=='u')r[k]=limpio(o[k]);});return r;}return o;}
function exportarJSON(soloPlantillas){
  var eq=limpio(ST.equipos);
  if(soloPlantillas)return JSON.stringify({listaEquipos:eq});
  var ps=ST.partidos.map(function(p){var q=limpio(p);q.fecha=(p.fecha-REF2001)/1000;return q;});
  return JSON.stringify({listaEquipos:eq,historicoPartidos:ps});
}
function normalizarJugador(j){return {id:String(j.id||uuid()),nombre:String(j.nombre||''),dorsal:Number(j.dorsal)||0,posicion:POS.indexOf(j.posicion)>=0?j.posicion:'Primera Línea'};}
function normalizarEquipo(e){var r={id:String(e.id||uuid()),nombre:String(e.nombre||'Equipo'),jugadores:(e.jugadores||[]).map(normalizarJugador)};if(e.categoria&&CATS.some(function(c){return c.v===e.categoria;}))r.categoria=e.categoria;return r;}
function normalizarPartido(p){
  var f=typeof p.fecha==='number'?(p.fecha>1e11?p.fecha:REF2001+p.fecha*1000):(Date.parse(p.fecha)||Date.now());
  return {id:String(p.id||uuid()),fecha:f,temporada:p.temporada||temporadaDe(f),nombreTuEquipo:p.nombreTuEquipo||'',nombreRival:p.nombreRival||'',golesLocal:p.golesLocal|0,golesVisitante:p.golesVisitante|0,
    categoria:cat(p.categoria).v,torneo:TORNEOS.indexOf(p.torneo)>=0?p.torneo:'Liga',acciones:(p.acciones||[]).map(function(a){var r=Object.assign({},a);r.id=String(a.id||uuid());return r;}),segundosJugados:p.segundosJugados||{}};
}
function importarJSON(txt){
  var d;try{d=JSON.parse(txt);}catch(e){return null;}
  if(!d||!Array.isArray(d.listaEquipos))return null;
  var eq=d.listaEquipos.map(normalizarEquipo);
  if(Array.isArray(d.historicoPartidos)){
    var viejos=ST.partidos.map(function(p){return p.id;});
    ST.partidos=d.historicoPartidos.map(normalizarPartido);
    var nuevos=ST.partidos.map(function(p){return p.id;});
    viejos.forEach(function(id){if(nuevos.indexOf(id)<0){ST.borrados.push(id);syncDirty.p[id]=1;}});
    ST.partidos.forEach(function(p){p.u=Date.now();syncDirty.p[p.id]=1;});
  }
  ST.equipos=eq;tocarEquipos();
  return {equipos:eq.length,partidos:Array.isArray(d.historicoPartidos)?d.historicoPartidos.length:null};
}

var CAB_EXCEL='ID Partido;Fecha;Rival;Competición;Categoría;Periodo;Tiempo;Fase Táctica;Resultado Acción;Jugador Implicado;Dorsal Rival;Zona Disparo;Zona Portería;Marcador Momento;Dorsal Propio;Posición;Tipo Lanzamiento;Situación\n';
function idPartido(p){var d=new Date(p.fecha);return 'P'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes());}
function filasExcel(p){
  var fichas={},eq=ST.equipos.find(function(e){return e.nombre===p.nombreTuEquipo;});
  (eq?eq.jugadores:[]).forEach(function(j){fichas[j.nombre]=j;});
  ST.equipos.forEach(function(o){if(o.nombre!==p.nombreTuEquipo)o.jugadores.forEach(function(j){if(!fichas[j.nombre])fichas[j.nombre]=j;});});
  var d=new Date(p.fecha),fecha=pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(),id=idPartido(p),rival=p.nombreRival.replace(/;/g,','),l=0,v=0,out='';
  p.acciones.forEach(function(a){
    if(a.tipo==='Ataque'&&a.resultado==='Gol')l++; if(a.tipo==='Defensa'&&a.resultado==='Gol')v++;
    var f=a.jugadorNombre?fichas[a.jugadorNombre]:null;
    out+=[id,fecha,rival,p.torneo,p.categoria,a.periodo!=null?a.periodo:'-',pad2(a.minuto)+':'+pad2(a.segundo),a.tipo,a.resultado,(a.jugadorNombre||'Mesa/Rival').replace(/;/g,','),
      a.dorsalRival!=null?a.dorsalRival:'-',a.zonaDisparo||'-',a.zonaPorteria!=null?a.zonaPorteria:'-',l+' - '+v,f?f.dorsal:'-',f?cap(f.posicion):'-',a.tipoLanzamiento||'-',a.situacion||'-'].join(';')+'\n';
  });
  return out;
}

var M=null;
function nuevoManager(){return {
  activo:false,equipo:null,nombreRival:'',torneo:'Liga',esLocal:true,temporada:temporadaDe(Date.now()),categoria:CATS[0].v,duracionPersonalizada:null,
  colorLocal:'Azul',colorRival:'Rojo',golesLocal:0,golesVisitante:0,minutos:0,segundos:0,periodo:1,
  timerRunning:false,ultimoTick:null,tmActivo:false,finTM:null,tmLocal:0,tmRival:0,
  exclusiones:[],descalificados:[],exclusionesRival:[],pista:[],tiempoJugado:{},racha:{},
  espAtaque:null,espDefensa:null,activarEsp:false,activarAlertas:true,
  dorsalesRivales:[],modoDorsal:'No anotar',anotarTipo:false,reservasActa:[],cambiosActa:0,
  historial:[],pila:[],pistaPrevia:null,aviso:null,avisoId:0,guardadoEn:Date.now()};}
M=nuevoManager();

var MM={
  dur:function(){return M.duracionPersonalizada||cat(M.categoria).d;},
  totalPeriodos:function(){return cat(M.categoria).p;},
  periodoTerminado:function(){return M.minutos>=MM.dur();},
  esUltimoPeriodo:function(){return M.periodo>=MM.totalPeriodos();},
  jugadores:function(){return M.equipo?M.equipo.jugadores:[];},
  jug:function(id){return MM.jugadores().find(function(j){return j.id===id;});},
  enPista:function(id){return M.pista.indexOf(id)>=0;},
  pistaDuranteLaJugada:function(){return M.pistaPrevia||M.pista;},
  estaExcluido:function(id){return M.exclusiones.some(function(e){return e.jugador.id===id;})||M.descalificados.indexOf(id)>=0;},
  etiquetaSancion:function(id){if(M.descalificados.indexOf(id)>=0)return 'ROJA';var e=M.exclusiones.find(function(x){return x.jugador.id===id;});return e?mss(e.restante):null;},
  efectivosNuestros:function(){return Math.max(7-M.exclusiones.length,0);},
  efectivosRival:function(){return Math.max(7-M.exclusionesRival.length,0);},
  situacion:function(){var n=MM.efectivosNuestros(),r=MM.efectivosRival();return n>r?SIT.sup:n<r?SIT.inf:SIT.ig;},
  textoSituacion:function(){return MM.efectivosNuestros()+' c '+MM.efectivosRival();},
  totalEfectivos:function(){return M.pista.length+M.exclusiones.length;},
  suplentesDisponibles:function(){return ordenAlin(MM.jugadores()).filter(function(j){return !MM.enPista(j.id)&&!MM.estaExcluido(j.id);});},
  actaAbierta:function(){return M.categoria===CATS[0].v||M.categoria===CATS[1].v;},
  cambiosActaRestantes:function(){return Math.max(0,MAX_CAMBIOS_ACTA-M.cambiosActa);},
  puedeCambiarActa:function(){return MM.actaAbierta()&&MM.cambiosActaRestantes()>0&&M.reservasActa.length>0;},
  convocadosQuePuedenSalir:function(){var con={};M.historial.forEach(function(a){if(a.jugadorId)con[a.jugadorId]=1;});return ordenAlin(MM.jugadores()).filter(function(j){return !MM.enPista(j.id)&&!MM.estaExcluido(j.id)&&!con[j.id];});},
  accion:function(o){return Object.assign({id:uuid(),minuto:M.minutos,segundo:M.segundos,periodo:M.periodo},o);},
  vibrar:function(p){try{navigator.vibrate&&navigator.vibrate(p||15);}catch(e){}},

  reiniciar:function(equipo){
    var ea=M.espAtaque,ed=M.espDefensa,ae=M.activarEsp,aa=M.activarAlertas;
    M=nuevoManager();M.activarEsp=ae;M.activarAlertas=aa;
    M.equipo=equipo;M.pista=(equipo?equipo.jugadores.slice(0,7):[]).map(function(j){return j.id;});
    var ids=(equipo?equipo.jugadores:[]).map(function(j){return j.id;});
    M.espAtaque=ids.indexOf(ea)>=0?ea:null;M.espDefensa=ids.indexOf(ed)>=0?ed:null;
    M.activo=true;
  },

  /* Reloj basado en la hora real: si la pantalla se bloquea, al volver recupera los segundos */
  startTimer:function(){if(M.timerRunning||M.tmActivo||MM.periodoTerminado())return;M.timerRunning=true;M.ultimoTick=Date.now();pedirWakeLock();},
  stopTimer:function(){M.timerRunning=false;M.ultimoTick=null;},
  siguientePeriodo:function(){if(!MM.periodoTerminado()||MM.esUltimoPeriodo())return;MM.stopTimer();M.periodo++;M.minutos=0;M.segundos=0;M.racha={};MM.vibrar(20);},
  tick:function(){
    var cambio=false;
    if(M.tmActivo&&M.finTM){if(Date.now()>=M.finTM){MM.finalizarTM();cambio=true;}}
    if(!M.timerRunning||!M.ultimoTick)return cambio;
    if(MM.periodoTerminado()){MM.stopTimer();return true;}
    var t=Math.floor((Date.now()-M.ultimoTick)/1000);
    if(t<1)return cambio;
    M.ultimoTick+=t*1000;
    for(var i=0;i<t;i++){if(MM.periodoTerminado())break;MM.avanzar(i===t-1);}
    if(MM.periodoTerminado()){MM.stopTimer();MM.vibrar([300,150,300]);sonido(880,.25);}
    return true;
  },
  avanzar:function(conSonido){
    if(M.segundos<59)M.segundos++;else{M.segundos=0;M.minutos++;}
    M.pista.forEach(function(id){M.tiempoJugado[id]=(M.tiempoJugado[id]||0)+1;var s=(M.racha[id]||0)+1;M.racha[id]=s;if(s%600===0)MM.avisarFatiga(id,s);});
    Object.keys(M.racha).forEach(function(id){if(!MM.enPista(id))delete M.racha[id];});
    if(M.exclusiones.length){
      var term=[];
      M.exclusiones.forEach(function(e){if(e.restante>0){e.restante--;if(conSonido&&e.restante<=10&&e.restante>0)sonido(1200,.06);}});
      M.exclusiones=M.exclusiones.filter(function(e){if(e.restante<=0){term.push(e);return false;}return true;});
      term.forEach(MM.avisarFinExclusion);
    }
    if(M.exclusionesRival.length){var antes=M.exclusionesRival.length;M.exclusionesRival=M.exclusionesRival.map(function(s){return s-1;}).filter(function(s){return s>0;});
      if(M.exclusionesRival.length<antes&&conSonido)MM.mostrarAviso('Termina la exclusión del rival: vuelven a estar completos.');}
  },
  mostrarAviso:function(t){M.aviso=t;var id=++M.avisoId;MM.vibrar([60,60,60]);setTimeout(function(){if(M.avisoId===id&&M.aviso===t){M.aviso=null;render();}},10000);},
  avisarFatiga:function(id,s){var j=MM.jug(id);if(!j||j.posicion==='Portero')return;MM.mostrarAviso('#'+j.dorsal+' '+j.nombre+' lleva '+Math.floor(s/60)+' min seguidos en pista. ¿Cambio?');},
  avisarFinExclusion:function(e){
    if(e.descalificado||M.descalificados.indexOf(e.jugador.id)>=0){MM.mostrarAviso('Termina la inferioridad por roja: ya puede entrar otro jugador.');return;}
    var t='Termina la exclusión de #'+e.jugador.dorsal+' '+e.jugador.nombre+': ya puede volver.';
    if(M.espAtaque===e.jugador.id)t='Vuelve el especialista de ataque #'+e.jugador.dorsal+' '+e.jugador.nombre+'.';
    else if(M.espDefensa===e.jugador.id)t='Vuelve el especialista de defensa #'+e.jugador.dorsal+' '+e.jugador.nombre+'.';
    MM.mostrarAviso(t);
  },

  solicitarTM:function(local){
    MM.stopTimer();
    MM.conPunto(null,function(){if(local){if(M.tmLocal<3)M.tmLocal++;}else{if(M.tmRival<3)M.tmRival++;}
      M.historial.push(MM.accion({tipo:'Tiempo Muerto',resultado:local?'Solicitado por Local':'Solicitado por Rival'}));});
    M.tmActivo=true;M.finTM=Date.now()+60000;
  },
  segTM:function(){return M.finTM?Math.max(0,Math.ceil((M.finTM-Date.now())/1000)):60;},
  finalizarTM:function(){M.tmActivo=false;M.finTM=null;MM.stopTimer();MM.vibrar(200);},

  /* Sanciones */
  agregarExclusion:function(j){if(MM.estaExcluido(j.id))return;MM.conPunto(null,function(){M.pista=M.pista.filter(function(x){return x!==j.id;});M.exclusiones.push({id:uuid(),jugador:clone(j),restante:120,descalificado:false});
    M.historial.push(MM.accion({tipo:'Sanción Disciplinaria',resultado:'2 Minutos',jugadorId:j.id,jugadorNombre:j.nombre}));});MM.vibrar([40,40,40]);},
  registrarTarjeta:function(j,t){MM.conPunto(null,function(){if(t==='Roja')MM.descalificar(j);M.historial.push(MM.accion({tipo:'Sanción Disciplinaria',resultado:t,jugadorId:j.id,jugadorNombre:j.nombre}));});MM.vibrar(t==='Roja'?[80,50,80,50,80]:[40,40,40]);},
  descalificar:function(j){if(M.descalificados.indexOf(j.id)<0)M.descalificados.push(j.id);M.pista=M.pista.filter(function(x){return x!==j.id;});
    if(!M.exclusiones.some(function(e){return e.jugador.id===j.id;}))M.exclusiones.push({id:uuid(),jugador:clone(j),restante:120,descalificado:true});
    if(M.espAtaque===j.id)M.espAtaque=null;if(M.espDefensa===j.id)M.espDefensa=null;},
  tarjetaBanquillo:function(t){MM.conPunto(null,function(){M.historial.push(MM.accion({tipo:'Sanción Disciplinaria',resultado:t,jugadorNombre:'Banquillo'}));});MM.vibrar(40);},
  exclusionBanquillo:function(j){if(MM.estaExcluido(j.id))return;MM.conPunto(null,function(){M.pista=M.pista.filter(function(x){return x!==j.id;});M.exclusiones.push({id:uuid(),jugador:clone(j),restante:120,descalificado:false});
    M.historial.push(MM.accion({tipo:'Sanción Disciplinaria',resultado:'2 Minutos Banquillo',jugadorNombre:'Banquillo'}));});MM.vibrar(40);},
  exclusionRival:function(){MM.conPunto(null,function(){M.exclusionesRival.push(120);M.historial.push(MM.accion({tipo:'Sanción Rival',resultado:'2 Minutos',jugadorNombre:'Rival'}));});MM.vibrar(40);},

  /* Alineación */
  completarAlineacion:function(){var nueva=M.pista.slice(),hayP=MM.jugadores().some(function(j){return nueva.indexOf(j.id)>=0&&j.posicion==='Portero';});
    MM.suplentesDisponibles().forEach(function(j){if(nueva.length+M.exclusiones.length>=7)return;if(j.posicion==='Portero'){if(hayP)return;hayP=true;}nueva.push(j.id);});M.pista=nueva;MM.vibrar(10);},
  conmutar:function(id){if(MM.estaExcluido(id))return;if(MM.enPista(id)){M.pista=M.pista.filter(function(x){return x!==id;});}else if(M.pista.length<7){M.pista.push(id);}else MM.vibrar(200);},
  intercambiar:function(sale,entra){if(sale===entra||!MM.enPista(sale)||MM.enPista(entra)||MM.estaExcluido(entra))return;M.pista=M.pista.filter(function(x){return x!==sale;}).concat([entra]);MM.vibrar(10);},
  faseAtaque:function(){if(!M.activarEsp||!M.espAtaque)return;if(M.espDefensa)M.pista=M.pista.filter(function(x){return x!==M.espDefensa;});if(!MM.estaExcluido(M.espAtaque)&&M.pista.length<7&&!MM.enPista(M.espAtaque))M.pista.push(M.espAtaque);},
  faseDefensa:function(){if(!M.activarEsp||!M.espDefensa)return;if(M.espAtaque)M.pista=M.pista.filter(function(x){return x!==M.espAtaque;});if(!MM.estaExcluido(M.espDefensa)&&M.pista.length<7&&!MM.enPista(M.espDefensa))M.pista.push(M.espDefensa);},
  cambioAuto:function(sale,entra){if(!M.activarEsp||!sale||!entra||sale===entra||!MM.enPista(sale)||MM.enPista(entra)||MM.estaExcluido(entra))return;M.pista=M.pista.filter(function(x){return x!==sale;}).concat([entra]);},
  cambioAnticipado:function(tipo,res){if(!M.activarEsp||!(res==='Gol'||res==='Parada')||M.pistaPrevia)return;var antes=M.pista.slice();
    if(tipo==='Ataque')MM.cambioAuto(M.espAtaque,M.espDefensa);else MM.cambioAuto(M.espDefensa,M.espAtaque);
    if(antes.join()!==M.pista.join())M.pistaPrevia=antes;},
  cancelarCambioAnticipado:function(){if(!M.pistaPrevia)return;M.pista=M.pistaPrevia;M.pistaPrevia=null;},

  registrarAccion:function(tipo,res,porteria,disparo,j,dorsalRival,tipoLanz){
    var previa=M.pistaPrevia;M.pistaPrevia=null;var sit=MM.situacion();
    MM.conPunto(previa,function(){
      var a=MM.accion({tipo:tipo,resultado:res,situacion:sit});
      if(porteria!=null)a.zonaPorteria=porteria; if(disparo)a.zonaDisparo=disparo; if(j){a.jugadorId=j.id;a.jugadorNombre=j.nombre;}
      if(dorsalRival!=null)a.dorsalRival=dorsalRival; if(tipoLanz)a.tipoLanzamiento=tipoLanz;
      M.historial.push(a);
      if(tipo==='Ataque'&&res==='Gol')M.golesLocal++; else if(tipo==='Defensa'&&res==='Gol')M.golesVisitante++;
      if(!previa&&(res==='Gol'||res==='Parada')){if(tipo==='Ataque')MM.cambioAuto(M.espAtaque,M.espDefensa);else MM.cambioAuto(M.espDefensa,M.espAtaque);}
    });
    MM.vibrar(res==='Gol'?[30,40,60]:15);
  },
  editarAccion:function(ed){var i=M.historial.findIndex(function(a){return a.id===ed.id;});if(i<0)return;M.historial[i]=ed;MM.recalcular();M.pila=[];},
  borrarAccion:function(id){var a=M.historial.find(function(x){return x.id===id;});if(!a||(a.tipo!=='Ataque'&&a.tipo!=='Defensa'))return;M.historial=M.historial.filter(function(x){return x.id!==id;});MM.recalcular();M.pila=[];},
  recalcular:function(){M.golesLocal=M.historial.filter(function(a){return a.tipo==='Ataque'&&a.resultado==='Gol';}).length;M.golesVisitante=M.historial.filter(function(a){return a.tipo==='Defensa'&&a.resultado==='Gol';}).length;},

  /* Acta abierta */
  cambiarEnActa:function(sale,entra){
    if(!MM.puedeCambiarActa()||!M.equipo)return;var i=M.equipo.jugadores.findIndex(function(j){return j.id===sale.id;});
    if(i<0||!MM.convocadosQuePuedenSalir().some(function(j){return j.id===sale.id;})||!M.reservasActa.some(function(j){return j.id===entra.id;}))return;
    M.equipo.jugadores[i]=clone(entra);M.reservasActa=M.reservasActa.filter(function(j){return j.id!==entra.id;});M.reservasActa.unshift(clone(sale));
    if(M.espAtaque===sale.id)M.espAtaque=null;if(M.espDefensa===sale.id)M.espDefensa=null;
    M.cambiosActa++;
    M.historial.push(MM.accion({tipo:'Acta',resultado:'Entra #'+entra.dorsal+' '+entra.nombre+' por #'+sale.dorsal+' '+sale.nombre,jugadorId:entra.id,jugadorNombre:entra.nombre}));
  },

  /* Deshacer */
  conPunto:function(pistaAntes,fn){
    var p={historial:M.historial.slice(),gl:M.golesLocal,gv:M.golesVisitante,tmL:M.tmLocal,tmR:M.tmRival,pistaAntes:(pistaAntes||M.pista).slice(),
      exIds:M.exclusiones.map(function(e){return e.id;}),desc:M.descalificados.slice(),ea:M.espAtaque,ed:M.espDefensa,exR:M.exclusionesRival.length};
    fn();p.pistaDespues=M.pista.slice();M.pila.push(p);if(M.pila.length>30)M.pila.shift();
  },
  puedeDeshacer:function(){return M.pila.length>0;},
  textoUltima:function(){if(!M.pila.length)return '';var a=null;for(var i=M.historial.length-1;i>=0;i--){if(M.historial[i].tipo!=='Acta'){a=M.historial[i];break;}}if(!a)return '';
    return a.tipo+': '+a.resultado+(a.jugadorNombre?' · '+a.jugadorNombre:'')+' ('+pad2(a.minuto)+':'+pad2(a.segundo)+')';},
  deshacer:function(){
    var p=M.pila.pop();if(!p)return;
    var prev={};p.historial.forEach(function(a){prev[a.id]=1;});
    var actas=M.historial.filter(function(a){return a.tipo==='Acta'&&!prev[a.id];});
    M.historial=p.historial.concat(actas);M.golesLocal=p.gl;M.golesVisitante=p.gv;M.descalificados=p.desc;
    M.exclusiones=M.exclusiones.filter(function(e){return p.exIds.indexOf(e.id)>=0;});M.espAtaque=p.ea;M.espDefensa=p.ed;
    if(M.exclusionesRival.length>p.exR)M.exclusionesRival=M.exclusionesRival.slice(0,p.exR);
    if(M.tmLocal!==p.tmL||M.tmRival!==p.tmR){M.tmLocal=p.tmL;M.tmRival=p.tmR;if(M.tmActivo){M.tmActivo=false;M.finTM=null;MM.stopTimer();}}
    if(M.pista.slice().sort().join()===p.pistaDespues.slice().sort().join())M.pista=p.pistaAntes;
    else p.pistaAntes.forEach(function(id){if(p.pistaDespues.indexOf(id)<0&&!MM.estaExcluido(id)&&M.pista.length<7&&!MM.enPista(id))M.pista.push(id);});
    MM.vibrar(20);
  },

  /* Estadísticas en directo */
  pctAtaque:function(){var t=M.golesLocal+M.historial.filter(function(a){return a.tipo.indexOf('Ataque')>=0&&(a.resultado==='Parada'||a.resultado==='Fuera');}).length;return t>0?M.golesLocal/t*100:0;},
  paradas:function(){return M.historial.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&a.resultado==='Parada';}).length;},
  lanzRecibidos:function(){return MM.paradas()+M.golesVisitante+M.historial.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&a.resultado==='Fuera';}).length;},
  pctPorteria:function(){var t=MM.paradas()+M.golesVisitante;return t>0?MM.paradas()/t*100:0;},
  porPuesto:function(pos){
    if(pos==='Portero'){var p=MM.paradas(),r=p+M.golesVisitante;return {g:p,t:r,p:r?p/r*100:0};}
    var f=M.historial.filter(function(a){if(a.tipo.indexOf('Ataque')<0||!a.jugadorId)return false;var j=MM.jug(a.jugadorId);return j&&j.posicion===pos;});
    var g=f.filter(function(a){return a.resultado==='Gol';}).length,t=f.filter(function(a){return ['Gol','Parada','Fuera'].indexOf(a.resultado)>=0;}).length;return {g:g,t:t,p:t?g/t*100:0};
  },
  porJugador:function(id){
    var ac=M.historial.filter(function(a){return a.jugadorId===id;}),j=MM.jug(id),esP=j&&j.posicion==='Portero';
    function n(r){return ac.filter(function(a){return a.resultado===r;}).length;}
    var s=M.tiempoJugado[id]||0,r={am:n('Amarilla'),ro:n('Roja'),az:n('Azul'),dm:n('2 Minutos'),mins:mmss(s),per:0};
    if(esP){var p=ac.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&a.resultado==='Parada';}).length,e=ac.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&a.resultado==='Gol';}).length;r.g=p;r.t=p+e;}
    else{r.g=n('Gol');r.t=r.g+ac.filter(function(a){return a.resultado==='Parada'||a.resultado==='Fuera';}).length;r.per=n('Pérdida');}
    r.p=r.t?r.g/r.t*100:0;return r;
  },
  segundosPorNombre:function(){var r={};MM.jugadores().forEach(function(j){var s=M.tiempoJugado[j.id];if(s>0)r[j.nombre]=(r[j.nombre]||0)+s;});return r;},
  construirPartido:function(){return {id:uuid(),fecha:Date.now(),temporada:M.temporada,nombreTuEquipo:M.equipo?M.equipo.nombre:'Nuestro Equipo',nombreRival:M.nombreRival,
    golesLocal:M.golesLocal,golesVisitante:M.golesVisitante,categoria:M.categoria,torneo:M.torneo,acciones:clone(M.historial),segundosJugados:MM.segundosPorNombre()};}
};

/* Eficacia por grupos (situación numérica / tipo de lanzamiento) */
function eficacia(acc,clave){
  var r={};acc.forEach(function(a){var k=a[clave];if(!k)return;var g=r[k]||{gf:0,tf:0,gc:0,tc:0,par:0};
    if(a.tipo==='Ataque'&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0){g.tf++;if(a.resultado==='Gol')g.gf++;}
    else if(a.tipo==='Defensa'&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0){g.tc++;if(a.resultado==='Gol')g.gc++;if(a.resultado==='Parada')g.par++;}
    else return; r[k]=g;});
  return r;
}
function hayDatos(g){return g.tf+g.tc>0;}

/* ---------- borrador del partido en curso ---------- */
var ultimoBorrador=0;
function guardarBorrador(forzar){
  if(!M.activo||!M.equipo)return;
  var ahora=Date.now();if(!forzar&&ahora-ultimoBorrador<3000)return;ultimoBorrador=ahora;
  M.guardadoEn=ahora;var b=clone(M);b.pila=[];b.timerRunning=false;b.ultimoTick=null;
  lsSet('sh_borrador',b);syncDirty.b=true;Sync.programar();
}
function cargarBorrador(){var b=lsGet('sh_borrador');return b&&b.equipo?b:null;}
function descartarBorrador(){M.activo=false;lsDel('sh_borrador');syncDirty.b=true;Sync.programar();}

/* ---------- sonido (avisos de la mesa) ---------- */
var actx=null;
function sonido(f,d){try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
document.addEventListener('pointerdown',function(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}},{once:true});
var wake=null;

function logo(t){return '<img class="logo" src="'+LOGO_SRC+'" width="'+t+'" height="'+t+'" style="border-radius:'+(t*.225)+'px" alt="Si Handball">';}
function amb(t){return '<div class="amb'+(t?' t-'+t:'')+'"></div>';}
function etq(t,i){return '<div class="etq">'+(i?ic(i):'')+'<span>'+esc(t)+'</span></div>';}
function ins(s,c,t){return '<span class="ins" style="--c:'+(c||'var(--acento)')+';--s:'+(t||34)+'px">'+ic(s)+'</span>';}
function fm(t,v,c){return '<div class="fm"><span class="sec">'+esc(t)+'</span><span class="v"'+(c?' style="color:'+c+'"':'')+'>'+esc(v)+'</span></div>';}
function pil(s,t,v,c){return '<div class="pil glass" style="color:'+c+'">'+ic(s)+'<span class="sec">'+esc(t)+'</span><span class="v">'+esc(v)+'</span></div>';}
function attrs(o){var s='';if(!o)return s;Object.keys(o).forEach(function(k){if(o[k]!=null&&o[k]!==false)s+=' data-'+k+'="'+esc(o[k])+'"';});return s;}
function bc(o){return '<button class="bc press" style="--c:'+(o.c||'var(--blue)')+';min-height:'+(o.h||64)+'px"'+attrs(o.d)+(o.dis?' disabled':'')+'><span class="t">'+(o.i?ic(o.i):'')+'<span>'+esc(o.t)+'</span></span>'+(o.s?'<span class="s">'+esc(o.s)+'</span>':'')+'</button>';}
function bj(o){var col=!!o.c;return '<button class="bj press '+(o.v?'v':'h')+(col?' tint2':' glass')+'" style="'+(col?'--c:'+o.c+';':'')+'min-height:'+(o.h||52)+'px'+(o.w?';width:'+o.w+'px;flex:none':'')+'"'+attrs(o.d)+(o.dis?' disabled':'')+'>'+
  (o.v?'<span class="d">'+esc(o.n1)+'</span><span class="n">'+esc(o.n2)+'</span>':'<span class="d">'+esc(o.n1)+'</span><span class="n">'+esc(o.n2)+'</span>')+'</button>';}

function sw(id,on,act,tint,extra){return '<label class="sw"'+(tint?' style="--sw:'+tint+'"':'')+'><input type="checkbox" id="'+id+'" data-ch="'+act+'"'+(on?' checked':'')+(extra?attrs(extra):'')+'><i></i></label>';}
function menu(id,ops,val,act,extra,clsx){var lab='';var opts=ops.map(function(o){if(o.g){return '<optgroup label="'+esc(o.g)+'">'+o.o.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>';}).join('')+'</optgroup>';}
  var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;if(String(v)===String(val))lab=l;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>';}).join('');
  if(extra&&extra.label)lab=extra.label;
  return '<label class="menu'+(clsx?' '+clsx:'')+'"><span>'+esc(lab)+'</span>'+ic('chevUD')+'<select id="'+id+'" data-ch="'+act+'"'+(extra?attrs(extra.d):'')+'>'+opts+'</select></label>';}
function cbtn(i,a,lab,dis,extra){return '<button class="cbtn glass press" data-a="'+a+'" aria-label="'+esc(lab)+'"'+(dis?' disabled':'')+(extra?attrs(extra):'')+'>'+ic(i)+'</button>';}
function tbtn(t,a,bold,dis,extra){return '<button class="tbtn glass press'+(bold?' bold':'')+'" data-a="'+a+'"'+(dis?' disabled':'')+(extra?attrs(extra):'')+'>'+esc(t)+'</button>';}
function fsec(h,hi,body,foot){return '<section class="fsec">'+(h?'<div class="fh">'+(hi?ic(hi):'')+'<span>'+h+'</span></div>':'')+'<div class="fbox">'+body+'</div>'+(foot?'<div class="ff">'+foot+'</div>':'')+'</section>';}
function swipe(body,act,data){return '<div class="swipe" data-swipe="1"><button class="sw-act" data-a="'+act+'"'+attrs(data)+'>'+ic('trash')+'Borrar</button><div class="sw-body">'+body+'</div></div>';}

function fexRow(d,n,t,live){return '<div class="fex"><span class="d">'+esc(d)+'</span><span class="sb f-sub ell">'+esc(n)+'</span><span class="t"'+(live?' data-live="'+live+'"':'')+'>'+esc(t)+'</span></div>';}

function acercaDe(){return '<div class="col center" style="align-items:center;gap:10px;padding:8px 0">'+logo(72)+'<div class="r blk f-title3">'+MARCA.app+'</div><div class="f-cap sec">Versión '+MARCA.version+'</div><hr class="divider" style="width:60%"><div class="f-sub sb">Desarrollada por '+MARCA.autor+'</div><div class="f-cap sec">'+copyright()+'<br>Todos los derechos reservados.</div></div>';}

function colorCalor(f,a){f=Math.min(Math.max(f,0),1);return 'hsla('+(50.4*(1-f)).toFixed(1)+',100%,54%,'+(a==null?1:a)+')';}
function mapaCalor(acciones,modo,dorsal){
  var m=MODO_MAPA[modo];
  var rel=acciones.filter(function(a){return a.tipo.indexOf(m.tipo)>=0&&m.res.indexOf(a.resultado)>=0&&(dorsal==null||a.dorsalRival===dorsal);});
  if(!rel.length)return '<div class="glass panel center f-foot sec">Todavía no hay lanzamientos registrados.</div>';
  function contar(k){var r={};rel.forEach(function(a){var z=a[k];if(z==null)return;var c=r[z]||{t:0,e:0};c.t++;if(a.resultado===m.ex)c.e++;r[z]=c;});return r;}
  var dp=contar('zonaPorteria'),dc=contar('zonaDisparo');

function graficoBarras(filas){
  var W=340,H=200,pl=26,pb=34,pt=18,max=Math.max(1,Math.max.apply(null,filas.map(function(f){return f.ac;}))),n=filas.length,bw=Math.min(36,(W-pl-8)/n*.6),step=(W-pl-8)/n;
  var ticks=[];var st=max<=5?1:max<=10?2:5;for(var t=0;t<=max;t+=st)ticks.push(t);
  var s='<svg viewBox="0 0 '+W+' '+H+'">';

  filas.forEach(function(f,i){var x=pl+step*i+step/2,h=(H-pt-pb)*(f.ac/max),y=H-pb-h;

    s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0)+'" rx="4" fill="url(#gb'+i+')"/>';
    if(f.in)s+='<text x="'+x+'" y="'+(y-4)+'" text-anchor="middle" style="fill:var(--naranja);font-weight:700">'+pct0(f.pct)+'</text>';
    s+='<text x="'+x+'" y="'+(H-pb+14)+'" text-anchor="middle">'+esc(f.et)+'</text><text x="'+x+'" y="'+(H-pb+26)+'" text-anchor="middle">'+esc(f.rival.slice(0,8))+'</text>';});
  return '<div class="chartbox">'+s+'</svg></div>';
}

function abrirFlow(t){FL={t:t,paso:'resultado',res:null,tipo:null,zp:null,zd:null,dorsal:null};if(t==='ataque')MM.faseAtaque();else MM.faseDefensa();}
function cerrarFlow(){FL=null;}
var FLA={
  flCancel:function(){MM.cancelarCambioAnticipado();cerrarFlow();},
  flRes:function(d){FL.res=d.v;
    if(FL.t==='ataque'){if(d.v==='Pérdida'){FL.paso='jugador';return;}MM.cambioAnticipado('Ataque',d.v);FL.paso=M.anotarTipo?'tipo':'porteria';}
    else{MM.cambioAnticipado('Defensa',d.v);FL.paso=M.anotarTipo?'tipo':((d.v==='Gol'||d.v==='Parada')?'porteria':'campo');}},
  flTipoChip:function(d){
    if(FL.tipo===d.v){FL.tipo=null;if(d.v===TL.m7&&FL.zd===TL.zona7)FL.zd=null;return;}
    if(FL.tipo===TL.m7&&FL.zd===TL.zona7)FL.zd=null;
    FL.tipo=d.v;
    if(d.v===TL.m7){FL.zd=TL.zona7;if(FL.paso==='campo'){if(FL.t==='ataque')FL.paso='jugador';else flDespuesCampo();}}},
  flTipo:function(d){FL.tipo=d.v;if(d.v===TL.m7)FL.zd=TL.zona7;
    if(FL.t==='ataque'){FL.paso='porteria';return;}
    if(FL.res==='Gol'||FL.res==='Parada')FL.paso='porteria';else if(FL.tipo===TL.m7)flDespuesCampo();else FL.paso='campo';},
  flPort:function(d){FL.zp=+d.v;if(FL.t==='ataque'){FL.paso=FL.tipo===TL.m7?'jugador':'campo';return;}if(FL.tipo===TL.m7)flDespuesCampo();else FL.paso='campo';},
  flCampo:function(d){FL.zd=d.v;if(FL.t==='ataque')FL.paso='jugador';else flDespuesCampo();},
  flJug:function(d){var j=d.v?MM.jug(d.v):null;var f=FL;cerrarFlow();
    var tipo=f.tipo||(f.zd===TL.zona7?TL.m7:null);
    var gl=M.golesLocal;MM.registrarAccion('Ataque',f.res,f.zp,f.zd,j,null,tipo);if(M.golesLocal>gl)S.pulso='L';},
  flDorsal:function(d){FL.dorsal=d.v===''?null:+d.v;flIrPortero();},
  flOtro:function(){S.alert={t:'Dorsal del rival',input:'Número',ok:'Añadir',a:'flOtroOk'};},
  flPortero:function(d){flGuardarDef(d.v?MM.jug(d.v):null);},
  flBack:function(){var p=FL.paso,at=FL.t==='ataque';
    function alRes(){MM.cancelarCambioAnticipado();FL.res=null;FL.tipo=null;FL.zp=null;FL.zd=null;FL.paso='resultado';}
    if(at){
      if(p==='tipo')alRes();
      else if(p==='porteria'){if(M.anotarTipo&&FL.res!=='Pérdida'){FL.tipo=null;FL.zd=null;FL.paso='tipo';}else alRes();}
      else if(p==='campo'){FL.zp=null;FL.paso='porteria';}
      else if(p==='jugador'){if(FL.res==='Pérdida'){FL.res=null;FL.paso='resultado';}else if(FL.tipo===TL.m7){FL.zp=null;FL.paso='porteria';}else{FL.zd=null;FL.paso='campo';}}
      return;}
    function antesPort(){if(M.anotarTipo){FL.tipo=null;FL.zd=null;FL.paso='tipo';}else alRes();}
    function antesRival(){if(FL.tipo===TL.m7){if(FL.res==='Gol'||FL.res==='Parada'){FL.zp=null;FL.paso='porteria';}else antesPort();}else{FL.zd=null;FL.paso='campo';}}
    if(p==='tipo')alRes();
    else if(p==='porteria'){FL.zp=null;antesPort();}
    else if(p==='campo'){FL.zd=null;if(FL.res==='Gol'||FL.res==='Parada'){FL.zp=null;FL.paso='porteria';}else antesPort();}
    else if(p==='rival'){FL.dorsal=null;antesRival();}
    else if(p==='portero'){FL.dorsal=null;if(preguntaDorsal())FL.paso='rival';else antesRival();}
  }
};
function flDespuesCampo(){if(preguntaDorsal())FL.paso='rival';else flIrPortero();}
function flIrPortero(){var act=MM.jugadores().filter(function(j){return j.posicion==='Portero'&&MM.pistaDuranteLaJugada().indexOf(j.id)>=0&&!MM.estaExcluido(j.id);});
  if(act.length===1)flGuardarDef(act[0]);else FL.paso='portero';}
function flGuardarDef(por){var f=FL;cerrarFlow();var gv=M.golesVisitante;

function datosResumen(p){
  var acc=p.acciones,c=cat(p.categoria),d={periodos:[]};
  if(acc.some(function(a){return a.periodo!=null;}))for(var n=1;n<=c.p;n++)d.periodos.push({id:n,l:acc.filter(function(a){return a.periodo===n&&a.tipo==='Ataque'&&a.resultado==='Gol';}).length,r:acc.filter(function(a){return a.periodo===n&&a.tipo==='Defensa'&&a.resultado==='Gol';}).length});
  var at=acc.filter(function(a){return a.tipo.indexOf('Ataque')>=0&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0;});
  d.gA=at.filter(function(a){return a.resultado==='Gol';}).length;d.tA=at.length;
  var df=acc.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&(a.resultado==='Gol'||a.resultado==='Parada');});
  d.par=df.filter(function(a){return a.resultado==='Parada';}).length;d.tR=df.length;
  var mp={};at.forEach(function(a){if(!a.jugadorNombre)return;var x=mp[a.jugadorNombre]||(mp[a.jugadorNombre]={id:a.jugadorNombre,g:0,t:0});x.t++;if(a.resultado==='Gol')x.g++;});
  var rs=Object.keys(mp).map(function(k){var x=mp[k];x.p=x.t?x.g/x.t*100:0;return x;});
  d.gol=rs.filter(function(x){return x.g>0;}).sort(function(a,b){return b.g-a.g;}).slice(0,3);
  var suf=rs.filter(function(x){return x.t>=3;});d.mej=suf.slice().sort(function(a,b){return b.p-a.p;}).slice(0,3);var im={};d.mej.forEach(function(x){im[x.id]=1;});
  d.peo=suf.slice().sort(function(a,b){return a.p-b.p;}).filter(function(x){return !im[x.id];}).slice(0,3);
  d.min=Object.keys(p.segundosJugados||{}).map(function(k){return {id:k,s:p.segundosJugados[k]};}).sort(function(a,b){return b.s-a.s;}).slice(0,6);

  return d;
}

function graficoEvolucion(p){

async function descargar(nombre,data){
  var dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){try{await dl.save({filename:nombre,data:new Blob([data])});return;}catch(e){if(e&&e.code==='declined')return;}}
  if(!window.claude){
    var tipo=/\.csv$/.test(nombre)?'text/csv':'application/json';
    try{var fi=new File([data],nombre,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[fi]})){await navigator.share({files:[fi],title:nombre});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    try{var u=URL.createObjectURL(new Blob([data],{type:tipo})),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return;}catch(e){}
  }
  abrirSheet('texto',{nombre:nombre,data:data});render();
}

  descartarBorrador();S.draft=null;
  MM.reiniciar(eq);
  M.nombreRival=F.rival.trim();M.torneo=F.torneo;M.esLocal=F.esLocal;M.categoria=catEfectiva();M.duracionPersonalizada=esAmistoso()?F.minAmistoso:null;
  M.modoDorsal=F.modoDorsal;M.colorLocal=F.colorLocal;M.colorRival=F.colorRival;M.anotarTipo=false;
  var enActa={};eq.jugadores.forEach(function(j){enActa[j.id]=1;});
  var propios=ordenAlin(e.jugadores).filter(function(j){return !enActa[j.id];}),otros=[];
  ST.equipos.filter(function(o){return o.id!==e.id;}).forEach(function(o){ordenAlin(o.jugadores).forEach(function(j){if(!enActa[j.id])otros.push(j);});});

}

(function(){
  var row=null,x0=0,y0=0,dx=0,drag=false;
  document.addEventListener('pointerdown',function(ev){var b=ev.target.closest('.sw-body');if(!b||ev.target.closest('select,input'))return;row=b.parentNode;x0=ev.clientX;y0=ev.clientY;dx=0;drag=false;},{passive:true});
  document.addEventListener('pointermove',function(ev){if(!row)return;var mx=ev.clientX-x0,my=ev.clientY-y0;
    if(!drag){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)){drag=true;if(swOpen&&swOpen!==row)cerrarSwipe();row.classList.add('dragging');}else if(Math.abs(my)>10){row=null;return;}}
    if(drag){var base=swOpen===row?-96:0;dx=Math.min(0,Math.max(-130,base+mx));row.querySelector('.sw-body').style.transform='translateX('+dx+'px)';}},{passive:true});
  function fin(){if(!row)return;var r=row;row=null;r.classList.remove('dragging');if(!drag)return;
    var body=r.querySelector('.sw-body');if(dx<-50){body.style.transform='translateX(-96px)';swOpen=r;r.classList.add('open');}else{body.style.transform='';r.classList.remove('open');if(swOpen===r)swOpen=null;}
    var bloq=function(e){e.stopPropagation();e.preventDefault();document.removeEventListener('click',bloq,true);};document.addEventListener('click',bloq,true);setTimeout(function(){document.removeEventListener('click',bloq,true);},50);}
  document.addEventListener('pointerup',fin);document.addEventListener('pointercancel',fin);
})();

/* =====================================================================
   Copia automática en la cuenta (datos privados de cada persona)
   ===================================================================== */
var Sync={activo:false,col:null,ultima:null,t:null,ultB:0,
  programar:function(){if(!Sync.col)return;clearTimeout(Sync.t);Sync.t=setTimeout(Sync.flush,1500);},
  flush:async function(){
    if(!Sync.col)return;
    try{
      if(syncDirty.eq){syncDirty.eq=false;await Sync.col.doc('equipos').set({lista:ST.equipos,u:ST.uEq||Date.now(),borrados:ST.borrados.slice(-800)});}
      var ids=Object.keys(syncDirty.p);syncDirty.p={};
      for(var i=0;i<ids.length;i++){var p=ST.partidos.find(function(x){return x.id===ids[i];});
        if(p)await Sync.col.doc('p_'+p.id).set({p:p,u:p.u||Date.now()});else await Sync.col.doc('p_'+ids[i]).delete();}
      if(syncDirty.b){if(Date.now()-Sync.ultB<10000){setTimeout(Sync.programar,10000);}else{syncDirty.b=false;Sync.ultB=Date.now();var b=lsGet('sh_borrador');
        if(b)await Sync.col.doc('borrador').set({b:b,u:b.guardadoEn||Date.now()});else await Sync.col.doc('borrador').delete();}}
      Sync.ultima=Date.now();
    }catch(e){
      if(e&&e.code==='quota_exceeded'){toast('No queda espacio en tu cuenta. Borra partidos antiguos.');render();}
      else if(e&&(e.code==='revoked'||e.code==='not_granted')){Sync.col=null;Sync.activo=false;}
    }
  },
  init:async function(){
    if(!window.claude||!window.claude.use)return;
    try{
      var db=await window.claude.use('db'),us=await window.claude.use('user');if(!db||!us)return;
      var uid=await us.id();if(!uid)return;
      var col=db.collection('data/users/'+uid),snap=await col.get(),rEq=null,rP={},rB=null;
      snap.docs.forEach(function(d){var x=d.data();if(!x)return;if(d.id==='equipos')rEq=x;else if(d.id==='borrador')rB=x;else if(d.id.indexOf('p_')===0&&x.p)rP[x.p.id]=x;});
      var bor={};(ST.borrados||[]).concat(rEq&&rEq.borrados||[]).forEach(function(id){bor[id]=1;});ST.borrados=Object.keys(bor);
      if(rEq&&(rEq.u||0)>(ST.uEq||0)){ST.equipos=(rEq.lista||[]).map(normalizarEquipo);ST.uEq=rEq.u;if(F.equipoId&&!equipoActual())F.equipoId=null;}
      else if(ST.uEq||!rEq)syncDirty.eq=true;
      var loc={};ST.partidos.forEach(function(p){loc[p.id]=p;});
      Object.keys(rP).forEach(function(id){if(bor[id]){syncDirty.p[id]=1;return;}var l=loc[id];if(!l||(rP[id].u||0)>(l.u||0))loc[id]=normalizarPartido(rP[id].p),loc[id].u=rP[id].u;else if((l.u||0)>(rP[id].u||0))syncDirty.p[id]=1;});
      Object.keys(loc).forEach(function(id){if(!rP[id])syncDirty.p[id]=1;});
      ST.partidos=Object.keys(loc).filter(function(id){return !bor[id];}).map(function(id){return loc[id];});
      var lb=lsGet('sh_borrador');
      if(rB&&rB.b&&!M.activo&&(!lb||(rB.u||0)>(lb.guardadoEn||0))){lsSet('sh_borrador',rB.b);S.draft=rB.b;}
      else if(lb&&(!rB||(lb.guardadoEn||0)>(rB.u||0)))syncDirty.b=true;
      Sync.col=col;Sync.activo=true;Sync.ultima=Date.now();lsSet('sh_store',ST);render();Sync.flush();
    }catch(e){}
  }
};

/* =====================================================================
   Acceso con código personal y fecha de caducidad (solo versión instalable)
   El código lo firma Juanma con su generador privado; aquí solo se comprueba.
   ===================================================================== */
var CLAVE_PUBLICA={"kty":"EC","crv":"P-256","x":"HXviliLob1Ywi6BFEa2mNj0wCPk7EnHf35Uzbrj1Bqk","y":"HpsFL1JF_h7c25kjko1vJtP_4UzxvqWibpaa0B0R3tc"};
var Acceso={
  b64d:function(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;},
  extraer:function(txt){txt=String(txt||'').trim();var m=txt.match(/[#?&]c=([A-Za-z0-9_\-.]+)/);if(m)return m[1];return txt.replace(/\s+/g,'');},
  verificar:async function(codigo){
    try{
      var p=codigo.split('.');if(p.length!==2)return {ok:false,motivo:'formato'};
      var key=await crypto.subtle.importKey('jwk',CLAVE_PUBLICA,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      var ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,Acceso.b64d(p[1]),new TextEncoder().encode(p[0]));
      if(!ok)return {ok:false,motivo:'firma'};
      var d=JSON.parse(new TextDecoder().decode(Acceso.b64d(p[0])));
      var fin=new Date(d.e+'T23:59:59');
      if(isNaN(fin))return {ok:false,motivo:'formato'};
      if(Date.now()>fin.getTime())return {ok:false,motivo:'caducado',datos:d};
      return {ok:true,datos:d};
    }catch(e){return {ok:false,motivo:'formato'};}
  },
  fecha:function(iso){return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});},
  pantalla:function(msg,err){
    var el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';document.body.appendChild(el);}
    el.innerHTML='<div class="gate">'+amb()+'<div class="wrap col" style="position:relative;z-index:1;align-items:center;gap:16px;text-align:center;max-width:420px">'+logo(110)+
      '<div class="r blk" style="font-size:30px">Si Handball</div><div class="sec f-sub">'+msg+'</div>'+
      '<input class="tf center" id="gate-in" placeholder="Pega aquí tu código o enlace" autocomplete="off" autocapitalize="off" spellcheck="false">'+
      (err?'<div class="f-foot" style="color:var(--red)">'+err+'</div>':'')+
      (navigator.clipboard&&navigator.clipboard.readText?'<button class="btn gl glass lg wfull" id="gate-paste">Pegar enlace copiado</button>':'')+'<button class="btn prom lg wfull" id="gate-ok">Entrar</button><div class="f-cap sec">Si no tienes código, pídeselo a '+MARCA.autor+'.</div><div class="f-cap2 ter">'+copyright()+'</div></div></div>';
    var go=function(){Acceso.probar(document.getElementById('gate-in').value);};
    document.getElementById('gate-ok').onclick=go;var ps=document.getElementById('gate-paste');if(ps)ps.onclick=function(){navigator.clipboard.readText().then(function(t){document.getElementById('gate-in').value=t;Acceso.probar(t);},function(){document.getElementById('gate-in').focus();});};
    document.getElementById('gate-in').onkeydown=function(e){if(e.key==='Enter')go();};
  },
  quitar:function(){var el=document.getElementById('gate');if(el)el.remove();},
  probar:async function(txt){
    var c=Acceso.extraer(txt);if(!c){Acceso.pantalla('Introduce tu código de acceso para usar la app.','Escribe o pega el código.');return;}
    var r=await Acceso.verificar(c);
    if(r.ok){lsSet('sh_acceso',c);Acceso.datos=r.datos;Acceso.quitar();render();return;}
    Acceso.pantalla('Introduce tu código de acceso para usar la app.',r.motivo==='caducado'?'Ese código caducó el '+Acceso.fecha(r.datos.e)+'.':'El código no es válido. Cópialo entero, tal como te lo enviaron.');
  },
  comprobar:async function(){
    var nuevo=Acceso.extraer(location.hash);
        var guardado=lsGet('sh_acceso');
    var c=(nuevo&&nuevo.indexOf('.')>0)?nuevo:guardado;
    if(!c){Acceso.pantalla('Introduce tu código de acceso para usar la app.');return;}
    var r=await Acceso.verificar(c);
    if(r.ok){if(c!==guardado)lsSet('sh_acceso',c);Acceso.datos=r.datos;Acceso.quitar();render();return;}
    if(r.motivo==='caducado'){Acceso.pantalla('Tu acceso de prueba terminó el '+Acceso.fecha(r.datos.e)+'. Tus equipos y partidos siguen guardados en este móvil: pide un código nuevo para seguir usándola.');}
    else Acceso.pantalla('Introduce tu código de acceso para usar la app.',guardado&&c===guardado?'El código guardado no es válido.':null);
  }
};
Acceso.pantalla('Comprobando el acceso…');
Acceso.comprobar();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')Acceso.comprobar();});
setInterval(function(){if(Acceso.datos&&Date.now()>new Date(Acceso.datos.e+'T23:59:59').getTime())Acceso.comprobar();},60000);
