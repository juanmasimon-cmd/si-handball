  --bg:#000000; --grouped:#000000; --surface2:#1C1C1E; --sys2:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(255,255,255,.08);
  --glass:rgba(44,44,50,.50); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.18);
  --glass-shadow:0 6px 22px rgba(0,0,0,.35);

.tbtn.bold{font-weight:700}
.tbtn.prom{background:var(--acento);color:#fff;border-color:transparent}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;color:var(--acento);min-height:40px}

/* BotonCristal */

  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));border:1px solid color-mix(in srgb,#fff 28%,var(--c));
  box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}

  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 95%,transparent),color-mix(in srgb,var(--c) 70%,transparent))}

/* Interruptor */
.sw{position:relative;width:51px;height:31px;flex:none;display:inline-block}

.form{display:flex;flex-direction:column;gap:22px;padding-bottom:20px}

}

/* Diálogo de confirmación */
.dlg-bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(0,0,0,.35)}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:71;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}

.hueco.cvac{min-height:52px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.hueco.cvac b{font-family:var(--f-round);font-weight:900;font-size:14px}
.menu.mini{padding:3px 6px 3px 8px;min-height:26px;font-size:11px;font-weight:700;border-radius:999px;background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.menu.mini svg{width:9px;height:9px}
.vozbtn{flex-shrink:0;margin-top:6px}
.vozbtn svg{width:20px;height:20px}
.vozbg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:65;background:rgba(0,0,0,.45)}
.vozbox{position:fixed;z-index:66;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 36px));display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:26px;background:var(--sheet)!important;animation:fade .2s}
@supports not (color-mix(in srgb,red 50%,blue)){.prepbox{background:rgba(255,149,0,.12);border-color:rgba(255,149,0,.35)}.menu.mini{background:rgba(0,122,255,.15)}.hueco.cvac{background:rgba(127,127,127,.12)}}

/* ---- web 11 ---- */
.flow .fbody>.wrap{width:100%;box-sizing:border-box}
:root{--teal:#30B0C7;--cyan:#32ADE6}
.dficha{touch-action:none;cursor:grab;z-index:2}
.dficha.drag{z-index:10;opacity:.9;transition:none}
.dficha.drag .ficha{box-shadow:0 8px 20px rgba(0,0,0,.3)}
.btn.sisb{flex:1;min-width:0;padding:5px 4px;font-family:var(--f-round);font-weight:800;font-size:14px;color:var(--label2)}
.btn.sisb.on{background:var(--blue);color:#fff}
.dcourt .cpos{min-width:50px;width:19%}
.dcourt .cpos .ficha{min-height:50px}
/* iPad en horizontal: panel fijo a la izquierda con la defensa */
body.ipadh{--pw:min(440px,40vw)}
.panelfijo{position:fixed;top:0;bottom:0;left:0;width:var(--pw);z-index:28;background:var(--bg);border-right:1px solid color-mix(in srgb,var(--label) 12%,transparent);overflow:hidden}
.panelfijo .pfin{position:relative;z-index:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.panelfijo .supl{flex-wrap:wrap;overflow:visible}
.panelfijo .supl .ficha{width:calc((100% - 30px) / 6)}
body.ipadh .screen.match .content{margin-left:var(--pw)}
body.ipadh .zinf,body.ipadh .tabbar,body.ipadh .flow{left:var(--pw)}
body.ipadh .avj{left:calc(var(--pw) + (100vw - var(--pw)) / 2);width:min(560px,calc(100vw - var(--pw) - 32px))}
@supports not (color-mix(in srgb,red 50%,blue)){.panelfijo{border-right:1px solid rgba(127,127,127,.25)}}

/* ---- web 12 ---- */
.rch{position:absolute;top:-8px;z-index:2;display:inline-flex;align-items:center;gap:1px;padding:1px 4px;border-radius:99px;color:#fff;font:900 9px/1.2 var(--f-round);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rch svg{width:9px;height:9px;stroke-width:3.2}
.rch.l{left:-6px}.rch.r{right:-6px}
.rch.in{position:static;vertical-align:middle;margin-left:2px}
.rch.up{background:var(--green)}.rch.dn{background:var(--red)}
.ficha.big .rch{font-size:11px;padding:2px 6px}.ficha.big .rch svg{width:11px;height:11px}
.pasrow{gap:8px;flex-wrap:wrap}
.pasrow>*{flex:1 1 auto;justify-content:center}
.accpanel{max-height:calc(100% - 40px);overflow-y:auto}
.accgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accviva{--c:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:74px;padding:6px;border-radius:16px;color:#fff;font-weight:850;font-size:14px;text-align:center;line-height:1.15;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 72%,#000 0%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 10px color-mix(in srgb,var(--c) 45%,transparent);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.accviva svg{width:24px;height:24px;stroke-width:2.4}
.flow.pp .courtwrap{max-width:min(100%,440px);margin:0 auto}
.flow.pp .cpos .ficha{min-height:58px}
.dosmitades{display:flex;gap:6px;align-items:flex-start}
.dosmitades>.mitad{flex:1;min-width:0}
.dosmitades .cpos{min-width:40px;width:21%}
.dosmitades .cpos .ficha{min-height:44px;border-radius:11px}
.dosmitades .cpos .ficha .d{font-size:16px}
.dosmitades .cpos .ficha .n{font-size:9px}
.dosmitades .sisb{padding:4px 8px;font-size:11px}
.dosmitades .defpista>.f-cap{display:none}
body.ipadh.split{--pw:min(620px,50vw)}
.gate .wrap{box-sizing:border-box}

/* ---- web 13 ---- */
.courtwrap.zlado{max-width:min(100%,420px);margin:0 auto;width:100%}
.courtwrap.zlado .znode{transform:translate(-50%,-50%) scale(.86)}
.posmenu{border:1px solid color-mix(in srgb,var(--indigo) 35%,transparent)}
#printzone{display:none}
@media print{
  body.imprimiendo{background:#fff!important}
  body.imprimiendo>*:not(#printzone){display:none!important}
  body.imprimiendo #printzone{display:block}
  body.imprimiendo #printzone .tres{box-shadow:none;max-width:none}
  @page{margin:12mm}
}

/* ---- web 14 ---- */
img.escudo{object-fit:contain;flex:none;border-radius:8px;display:inline-block;vertical-align:middle}
.casilla .n img.esc-marc{width:40px;height:40px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.escvacio{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--label3);background:color-mix(in srgb,var(--label) 8%,transparent)}
.escvacio svg{width:20px;height:20px}
.znode.zdest{outline:3px solid #FFCC00;outline-offset:2px;box-shadow:0 0 0 0 rgba(255,204,0,.8);animation:zpulso 1.4s ease-in-out infinite}
@keyframes zpulso{0%,100%{box-shadow:0 0 2px 1px rgba(255,204,0,.35);outline-color:rgba(255,204,0,.45)}50%{box-shadow:0 0 16px 6px rgba(255,204,0,.9);outline-color:#FFCC00}}
@media (prefers-reduced-motion:reduce){.znode.zdest{animation:none}}
.tdef .tddef,.tddef{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:var(--blue);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3);z-index:2}
.tddef b{font:900 18px/1 var(--f-round)}.tddef span{font:700 8px/1.2 var(--f-round)}
.tdzona{position:absolute;transform:translate(-50%,-50%);width:46px;height:36px;border-radius:99px;display:grid;place-items:center;color:#000;background:rgba(255,204,0,.92);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.45);z-index:1}
.tdzona svg{width:20px;height:20px;stroke-width:2.8}
.ficha.espA,.ficha.espD{box-shadow:inset 0 0 0 3px var(--blue)}
.ficha.espD{box-shadow:inset 0 0 0 3px var(--purple)}
.ficha.espA::after,.ficha.espD::after{content:'ATA';position:absolute;left:-4px;bottom:-6px;padding:1px 4px;border-radius:6px;font:900 8px/1.2 var(--f-round);color:#fff;background:var(--blue)}
.ficha.espD::after{content:'DEF';background:var(--purple)}
.cifras{display:flex;gap:8px}
.cifra{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:color-mix(in srgb,var(--label) 6%,transparent)}
.cifra b{font:900 20px/1.1 var(--f-round);font-variant-numeric:tabular-nums}.cifra span{font-size:11px;color:var(--label2);text-align:center}
.jugrow{gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--label) 8%,transparent)}
.jugrow:last-child{border-bottom:0}

.tres{--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--fill2:rgba(0,0,0,.06);--blue:#007AFF;--indigo:#5856D6;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--naranja:#FEA50E}
.tabbar.mini .in{width:auto;padding:3px}
.tabbar.mini button{flex-direction:row;gap:6px;padding:7px 14px;font-size:12px}
.tabbar.mini button svg{width:18px;height:18px}
.zinf{bottom:calc(52px + env(safe-area-inset-bottom,0px))!important;padding-bottom:6px!important}
.match .content{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
.zinf{z-index:26}
.gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;display:grid;place-items:center;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
</style>

function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function cap(s){return String(s).split(' ').map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w;}).join(' ');}

/* Fechas en español */
var ES='es-ES';
function fechaLarga(ms){var d=new Date(ms);return d.toLocaleDateString(ES,{day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString(ES,{hour:'2-digit',minute:'2-digit'});}
function fechaCorta(ms){var d=new Date(ms);return d.toLocaleDateString(ES,{day:'numeric',month:'short',year:'numeric'}).replace('.','')+', '+d.toLocaleTimeString(ES,{hour:'2-digit',minute:'2-digit'});}
function haceEsp(ms){var s=Math.round((Date.now()-ms)/1000);var rtf;try{rtf=new Intl.RelativeTimeFormat(ES,{numeric:'auto'});}catch(e){return '';}
  if(s<60)return rtf.format(-s,'second');var m=Math.round(s/60);if(m<60)return rtf.format(-m,'minute');var h=Math.round(m/60);if(h<24)return rtf.format(-h,'hour');return rtf.format(-Math.round(h/24),'day');}
function fechaDM(ms){return new Date(ms).toLocaleDateString(ES,{day:'numeric',month:'short'}).replace('.','');}

var REF2001=978307200000;

  return JSON.stringify({listaEquipos:eq,historicoPartidos:ps});
}
function normalizarJugador(j){var r={id:String(j.id||uuid()),nombre:String(j.nombre||''),dorsal:Number(j.dorsal)||0,posicion:POS.indexOf(j.posicion)>=0?j.posicion:'Primera Línea'};if(j.puesto&&PUESTOS.some(function(p){return p.id===j.puesto;}))r.puesto=j.puesto;return r;}

  var f=typeof p.fecha==='number'?(p.fecha>1e11?p.fecha:REF2001+p.fecha*1000):(Date.parse(p.fecha)||Date.now());
  return {id:String(p.id||uuid()),fecha:f,temporada:p.temporada||temporadaDe(f),nombreTuEquipo:p.nombreTuEquipo||'',nombreRival:p.nombreRival||'',golesLocal:p.golesLocal|0,golesVisitante:p.golesVisitante|0,
    categoria:cat(p.categoria).v,torneo:TORNEOS.indexOf(p.torneo)>=0?p.torneo:'Liga',acciones:(p.acciones||[]).map(function(a){var r=Object.assign({},a);r.id=String(a.id||uuid());return r;}),segundosJugados:p.segundosJugados||{},esLocal:p.esLocal!==false};
}
function importarJSON(txt){
  var d;try{d=JSON.parse(txt);}catch(e){return null;}
  if(!d||!Array.isArray(d.listaEquipos))return null;
  var eq=d.listaEquipos.map(normalizarEquipo);
  if(Array.isArray(d.historicoPartidos)){
    var viejos=ST.partidos.map(function(p){return p.id;});
    ST.partidos=d.historicoPartidos.map(normalizarPartido);
    var nuevos=ST.partidos.map(function(p){return p.id;});

    ST.partidos.forEach(function(p){p.u=Date.now();syncDirty.p[p.id]=1;});
  }

/* Eficacia por grupos (situación numérica / tipo de lanzamiento) */
function eficacia(acc,clave){
  var r={};acc.forEach(function(a){var k=a[clave];if(!k)return;var g=r[k]||{gf:0,tf:0,gc:0,tc:0,par:0};
    if(a.tipo==='Ataque'&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0){g.tf++;if(a.resultado==='Gol')g.gf++;}

    else return; r[k]=g;});
  return r;
}

  var a=args[1]||'',b=args[2]||'transparent',m=a.match(/^(.*)\s+(\d+(?:\.\d+)?)%$/),col=m?m[1].trim():a,p=m?parseFloat(m[2]):50;

/* Reparto de los titulares en los siete puestos (VistaCampo.swift) */
function repartoEnPista(tit){
  var rep={},pend=[],sin=[],man=(typeof M!=='undefined'&&M.activo&&M.puestosAt)||{},hecho={};
  tit.forEach(function(j){var p=man[j.id];if(p&&puestoDe(p)&&!rep[p]){rep[p]=j;hecho[j.id]=1;}});
  tit.forEach(function(j){if(hecho[j.id])return;if(j.puesto&&puestoDe(j.puesto)&&!rep[j.puesto])rep[j.puesto]=j;else pend.push(j);});
  pend.forEach(function(j){var pref=j.posicion==='Portero'?['Portero']:j.posicion==='Pivote'?['Pivote']:j.posicion==='Extremo'?['Extremo izquierdo','Extremo derecho']:['Lateral izquierdo','Central','Lateral derecho'];
    var p=pref.find(function(x){return !rep[x];});if(p)rep[p]=j;else sin.push(j);});
  var orden=['Lateral izquierdo','Central','Lateral derecho','Extremo izquierdo','Extremo derecho','Pivote','Portero'];
  sin.forEach(function(j){var p=orden.find(function(x){return !rep[x];});if(p)rep[p]=j;});
  return rep;
}
/* Parciales por tramos de 5 minutos (4 o 3 si el periodo no es múltiplo de 5), sin cruzar periodos */
function parciales(acc,durPeriodo,actual){
  var dur=Math.max(1,durPeriodo|0),tam=dur%5===0?5:(dur%4===0?4:3),tpp=Math.ceil(dur/tam);
  function idx(per,min){var p=Math.max(1,per||1)-1,k=Math.min(Math.max(0,min|0)/tam|0,tpp-1);return p*tpp+k;}
  var goles=acc.filter(function(a){return a.resultado==='Gol'&&(a.tipo==='Ataque'||a.tipo==='Defensa');}),ult=-1;
  goles.forEach(function(g){ult=Math.max(ult,idx(g.periodo,g.minuto));});
  if(actual)ult=Math.max(ult,idx(actual[0],actual[1]));
  if(ult<0)return [];
  var tr=[];for(var i=0;i<=ult;i++){var p=i/tpp|0,k=i%tpp,de=p*dur+k*tam;tr.push({id:i,periodo:p+1,desde:de,hasta:Math.min(de+tam,(p+1)*dur),favor:0,contra:0,af:0,ac:0});}
  goles.forEach(function(g){var t=tr[idx(g.periodo,g.minuto)];if(g.tipo==='Ataque')t.favor++;else t.contra++;});
  var af=0,ac=0;tr.forEach(function(t){af+=t.favor;ac+=t.contra;t.af=af;t.ac=ac;t.dif=t.favor-t.contra;t.et=t.desde+"'–"+t.hasta+"'";});
  return tr;
}
/* Goles seguidos de un mismo equipo al final (3 o más) */
function rachaGoles(acc,min){min=min||3;var n=0,nuestra=null;
  for(var i=acc.length-1;i>=0;i--){var a=acc[i];if(a.resultado!=='Gol'||(a.tipo!=='Ataque'&&a.tipo!=='Defensa'))continue;var es=a.tipo==='Ataque';if(nuestra===null)nuestra=es;if(nuestra===es)n++;else break;}
  return nuestra!==null&&n>=min?{nuestra:nuestra,goles:n}:null;}
/* Más/menos por jugador de campo y parejas en pista (solo goles que guardaron quién estaba en pista) */
function rendimientoEnPista(acc,minPareja){
  minPareja=minPareja||3;var par={},jug={};
  acc.forEach(function(a){if(a.resultado!=='Gol'||(a.tipo!=='Ataque'&&a.tipo!=='Defensa')||!a.pistaNombres||!a.pistaNombres.length)return;
    var f=a.tipo==='Ataque',ns=a.pistaNombres.filter(function(x,i,l){return l.indexOf(x)===i;}).sort();
    ns.forEach(function(n){var j=jug[n]||(jug[n]={id:n,favor:0,contra:0});if(f)j.favor++;else j.contra++;});
    for(var i=0;i<ns.length;i++)for(var k=i+1;k<ns.length;k++){var c=ns[i]+'|'+ns[k],p=par[c]||(par[c]={id:c,nombres:ns[i]+' + '+ns[k],favor:0,contra:0});if(f)p.favor++;else p.contra++;}});
  function dif(x){return x.favor-x.contra;}
  var lp=Object.keys(par).map(function(k){return par[k];}).filter(function(p){return p.favor+p.contra>=minPareja;}).sort(function(a,b){return dif(b)-dif(a)||(b.favor+b.contra)-(a.favor+a.contra);});
  var lj=Object.keys(jug).map(function(k){return jug[k];}).sort(function(a,b){return dif(b)-dif(a)||(a.id<b.id?-1:1);});
  return {parejas:lp,jugadores:lj};
}
/* Cierre de cada parte: últimos 5 minutos frente al resto */
function calculoCierre(ps){var u=5,ci={f:0,c:0,p:0,t:0},re={f:0,c:0,p:0,t:0};
  ps.forEach(function(p){var c=cat(p.categoria),dur=c.d,per=c.p;if(dur<=u)return;ci.t+=per;re.t+=per*(dur-u)/u;
    p.acciones.forEach(function(a){var x=a.minuto>=dur-u?ci:re;if(a.resultado==='Gol'&&a.tipo==='Ataque')x.f++;else if(a.resultado==='Gol'&&a.tipo==='Defensa')x.c++;else if(a.resultado==='Pérdida'&&a.tipo==='Ataque')x.p++;});});
  [ci,re].forEach(function(x){x.bal=x.t?(x.f-x.c)/x.t:0;x.per=x.t?x.p/x.t:0;});
  return {cierre:ci,resto:re,hay:ci.t>0&&ci.f+ci.c+re.f+re.c>0};}
function coincideRival(a,b){var l=function(s){return String(s||'').trim().toLowerCase();};return !!l(a)&&l(a)===l(b);}

  function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);}
  function izq(t){return t.indexOf('izq')===0;} function der(t){return t.indexOf('der')===0;}

function logo(t){return '<img class="logo" src="'+LOGO_SRC+'" width="'+t+'" height="'+t+'" style="border-radius:'+(t*.225)+'px" alt="Si Handball">';}
function amb(t){return '<div class="amb'+(t?' t-'+t:'')+'"></div>';}
function etq(t,i){return '<div class="etq">'+(i?ic(i):'')+'<span>'+esc(t)+'</span></div>';}
function ins(s,c,t){return '<span class="ins" style="--c:'+(c||'var(--acento)')+';--s:'+(t||34)+'px">'+ic(s)+'</span>';}
function fm(t,v,c){return '<div class="fm"><span class="sec">'+esc(t)+'</span><span class="v"'+(c?' style="color:'+c+'"':'')+'>'+esc(v)+'</span></div>';}
function pil(s,t,v,c){return '<div class="pil glass" style="color:'+c+'">'+ic(s)+'<span class="sec">'+esc(t)+'</span><span class="v">'+esc(v)+'</span></div>';}
function attrs(o){var s='';if(!o)return s;Object.keys(o).forEach(function(k){if(o[k]!=null&&o[k]!==false)s+=' data-'+k+'="'+esc(o[k])+'"';});return s;}
function bc(o){return '<button class="bc press'+(o.big?' big':'')+'" style="--c:'+(o.c||'var(--blue)')+';min-height:'+(o.h||64)+'px"'+attrs(o.d)+(o.dis?' disabled':'')+'><span class="t">'+(o.i?ic(o.i):'')+'<span>'+esc(o.t)+'</span></span>'+(o.s?'<span class="s">'+esc(o.s)+'</span>':'')+'</button>';}
function bj(o){var col=!!o.c;return '<button class="bj press '+(o.v?'v':'h')+(col?' tint2':' glass')+'" style="'+(col?'--c:'+o.c+';':'')+'min-height:'+(o.h||52)+'px'+(o.w?';width:'+o.w+'px;flex:none':'')+'"'+attrs(o.d)+(o.dis?' disabled':'')+'>'+
  (o.v?'<span class="d">'+esc(o.n1)+'</span><span class="n">'+esc(o.n2)+'</span>':'<span class="d">'+esc(o.n1)+'</span><span class="n">'+esc(o.n2)+'</span>')+'</button>';}
function seg(act,ops,val,extra){return '<div class="seg" role="tablist">'+ops.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<button role="tab" aria-selected="'+(v===val)+'" class="'+(v===val?'on':'')+'" data-a="'+act+'" data-v="'+esc(v)+'"'+(extra?attrs(extra):'')+'>'+esc(l)+'</button>';}).join('')+'</div>';}
function sw(id,on,act,tint,extra){return '<label class="sw"'+(tint?' style="--sw:'+tint+'"':'')+'><input type="checkbox" id="'+id+'" data-ch="'+act+'"'+(on?' checked':'')+(extra?attrs(extra):'')+'><i></i></label>';}
function menu(id,ops,val,act,extra,clsx){var lab='';var opts=ops.map(function(o){if(o.g){return '<optgroup label="'+esc(o.g)+'">'+o.o.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>';}).join('')+'</optgroup>';}
  var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;if(String(v)===String(val))lab=l;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>';}).join('');
  if(extra&&extra.label)lab=extra.label;
  return '<label class="menu'+(clsx?' '+clsx:'')+'"><span>'+esc(lab)+'</span>'+ic('chevUD')+'<select id="'+id+'" data-ch="'+act+'"'+(extra?attrs(extra.d):'')+'>'+opts+'</select></label>';}
function cbtn(i,a,lab,dis,extra){return '<button class="cbtn glass press" data-a="'+a+'" aria-label="'+esc(lab)+'"'+(dis?' disabled':'')+(extra?attrs(extra):'')+'>'+ic(i)+'</button>';}
function tbtn(t,a,bold,dis,extra){return '<button class="tbtn glass press'+(bold?' bold':'')+'" data-a="'+a+'"'+(dis?' disabled':'')+(extra?attrs(extra):'')+'>'+esc(t)+'</button>';}
function fsec(h,hi,body,foot){return '<section class="fsec">'+(h?'<div class="fh">'+(hi?ic(hi):'')+'<span>'+h+'</span></div>':'')+'<div class="fbox">'+body+'</div>'+(foot?'<div class="ff">'+foot+'</div>':'')+'</section>';}
function swipe(body,act,data){return '<div class="swipe" data-swipe="1"><button class="sw-act" data-a="'+act+'"'+attrs(data)+'>'+ic('trash')+'Borrar</button><div class="sw-body">'+body+'</div></div>';}

function fexRow(d,n,t,live){return '<div class="fex"><span class="d">'+esc(d)+'</span><span class="sb f-sub ell">'+esc(n)+'</span><span class="t"'+(live?' data-live="'+live+'"':'')+'>'+esc(t)+'</span></div>';}

function acercaDe(){return '<div class="col center" style="align-items:center;gap:10px;padding:8px 0">'+logo(72)+'<div class="r blk f-title3">'+MARCA.app+'</div><div class="f-cap sec">Versión '+MARCA.version+'</div><hr class="divider" style="width:60%"><div class="f-sub sb">Desarrollada por '+MARCA.autor+'</div><div class="f-cap sec">'+copyright()+'<br>Todos los derechos reservados.</div></div>';}

  equipoAtaca:{tipo:'Ataque',res:['Gol','Parada','Fuera'],ex:'Gol',et:'gol',tp:'POR DÓNDE ATACAMOS',tc:'DESDE DÓNDE ATACAMOS'},

function colorCalor(f,a){f=Math.min(Math.max(f,0),1);return 'hsla('+(50.4*(1-f)).toFixed(1)+',100%,54%,'+(a==null?1:a)+')';}
function mapaCalor(acciones,modo,dorsal){
  var m=MODO_MAPA[modo];
  var rel=acciones.filter(function(a){return a.tipo.indexOf(m.tipo)>=0&&m.res.indexOf(a.resultado)>=0&&(dorsal==null||a.dorsalRival===dorsal);});
  if(!rel.length)return '<div class="glass panel center f-foot sec">Todavía no hay lanzamientos registrados.</div>';
  function contar(k){var r={};rel.forEach(function(a){var z=a[k];if(z==null)return;var c=r[z]||{t:0,e:0};c.t++;if(a.resultado===m.ex)c.e++;r[z]=c;});return r;}
  var dp=contar('zonaPorteria'),dc=contar('zonaDisparo');

function signo(n){return n>0?'+'+n:String(n);}
function colorDif(n){return n>0?'var(--green)':n<0?'var(--red)':'var(--gray)';}
function barraPct(v,c){v=Math.min(Math.max(v,0),1);return '<div class="barra" aria-hidden="true"><i style="width:'+(v*100).toFixed(1)+'%;background:'+c+'"></i></div>';}
function graficoParciales(tr){
  var W=340,H=120,x0=24,x1=W-6,y0=8,y1=H-18,n=tr.length,mx=Math.max(1,Math.max.apply(null,tr.map(function(t){return Math.abs(t.dif);}))),st=(x1-x0)/n,bw=Math.min(22,st*.62),ym=(y0+y1)/2;
  function Y(v){return ym-(ym-y0)*v/mx;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Diferencia de goles por tramo">';
  [mx,0,-mx].forEach(function(v){s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--label)" stroke-opacity="'+(v===0?.35:.08)+'"/><text x="'+(x0-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+signo(v)+'</text>';});
  var cada=n<=8?1:n<=14?2:3;
  tr.forEach(function(t,i){var x=x0+st*i+st/2,y=Y(Math.max(t.dif,0)),h=Math.abs(Y(t.dif)-ym);
    if(t.dif!==0)s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(t.dif>0?y:ym).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" fill="'+(t.dif>0?'var(--green)':'var(--red)')+'"/>';
    else s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(ym-1)+'" width="'+bw.toFixed(1)+'" height="2" fill="var(--gray)" opacity=".5"/>';
    if(i%cada===0)s+='<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+t.desde+"'</text>";});
  return '<div class="chartbox">'+s+'</svg></div>';
}
function tablaParciales(tr){
  var h='<div class="tpar">'+(tr.length>1?graficoParciales(tr):'')+'<div class="tr h"><span>Tramo</span><span>Parcial</span><span>Marcador</span><span>Dif.</span></div>';
  tr.forEach(function(t){h+='<div class="tr"><span class="sb">'+t.et+'</span><span class="r b tn">'+t.favor+'–'+t.contra+'</span><span class="r tn sec">'+t.af+'–'+t.ac+'</span><span class="r b tn" style="color:'+colorDif(t.dif)+'">'+signo(t.dif)+'</span></div>';});

function graficoBarras(filas){

    s+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0)+'" rx="4" fill="url(#gb'+i+')"/>';

function datosResumen(p){

  var at=acc.filter(function(a){return a.tipo.indexOf('Ataque')>=0&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0;});
  d.gA=at.filter(function(a){return a.resultado==='Gol';}).length;d.tA=at.length;
  var df=acc.filter(function(a){return a.tipo.indexOf('Defensa')>=0&&(a.resultado==='Gol'||a.resultado==='Parada');});
  d.par=df.filter(function(a){return a.resultado==='Parada';}).length;d.tR=df.length;
  var mp={};at.forEach(function(a){if(!a.jugadorNombre)return;var x=mp[a.jugadorNombre]||(mp[a.jugadorNombre]={id:a.jugadorNombre,g:0,t:0});x.t++;if(a.resultado==='Gol')x.g++;});
  var rs=Object.keys(mp).map(function(k){var x=mp[k];x.p=x.t?x.g/x.t*100:0;return x;});
  d.gol=rs.filter(function(x){return x.g>0;}).sort(function(a,b){return b.g-a.g;}).slice(0,3);
  var suf=rs.filter(function(x){return x.t>=3;});d.mej=suf.slice().sort(function(a,b){return b.p-a.p;}).slice(0,3);var im={};d.mej.forEach(function(x){im[x.id]=1;});
  d.peo=suf.slice().sort(function(a,b){return a.p-b.p;}).filter(function(x){return !im[x.id];}).slice(0,3);
  d.min=Object.keys(p.segundosJugados||{}).map(function(k){return {id:k,s:p.segundosJugados[k]};}).sort(function(a,b){return b.s-a.s;}).slice(0,6);

  return d;
}

function graficoEvolucion(p){

  var sx=dur>=20?10:5;for(var m=0;m<=mx+.01;m+=sx)s+='<text x="'+X(m)+'" y="'+(y1+13)+'" text-anchor="middle" style="fill:#8E8E93">'+m+'</text>';
  s+='<text x="'+x1+'" y="'+(H-2)+'" text-anchor="end" style="fill:#8E8E93">minuto</text>';

/* =====================================================================
   Resumen del periodo (ResumenDescansoView) e informe del rival
   ===================================================================== */
function shDescanso(){
  var per=M.periodo,acc=M.historial.filter(function(a){return (a.periodo||1)===per;});
  function n(t,r){return acc.filter(function(a){return a.tipo===t&&a.resultado===r;}).length;}
  var gf=n('Ataque','Gol'),gc=n('Defensa','Gol'),pe=n('Ataque','Pérdida'),tf=acc.filter(function(a){return a.tipo==='Ataque'&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0;}).length,pa=n('Defensa','Parada');
  function tarj(t,i,c){return '<div class="glass panel stack12">'+etq(t,i)+c+'</div>';}
  var h='<div class="wrap stack" style="padding-top:6px">';
  h+=tarj('MARCADOR','partido','<div class="r blk tn" style="font-size:44px">'+marcadorM()+'</div>'+fm('En este periodo',gf+' – '+gc,gf>=gc?'var(--green)':'var(--red)')+fm('Tiempos muertos (nosotros / rival)',M.tmLocal+' / '+M.tmRival));
  var tr=parciales(M.historial,MM.dur(),[per,M.minutos]).filter(function(t){return t.periodo===per;});
  if(tr.length>1)h+=tarj('PARCIALES','stats',tablaParciales(tr));
  h+=tarj('EFICACIA DEL PERIODO','stats',fm('Ataque',tf?pct0(gf/tf*100)+' ('+gf+'/'+tf+')':'–','var(--blue)')+fm('Portería',pa+gc?pct0(pa/(pa+gc)*100)+' ('+pa+'/'+(pa+gc)+')':'–','var(--indigo)')+fm('Balones perdidos',String(pe),'var(--red)'));
  var si=eficacia(acc,'situacion');if(Object.keys(si).some(function(k){return k!==SIT.ig;}))h+=tarj('SUPERIORIDAD E INFERIORIDAD','person2',tablaEficacia(si,SIT.todas));
  var cu={};acc.forEach(function(a){if(a.tipo==='Ataque'&&a.resultado==='Gol'){var k=a.jugadorNombre||'Sin asignar';cu[k]=(cu[k]||0)+1;}});
  var gol=Object.keys(cu).sort(function(a,b){return cu[b]-cu[a]||(a<b?-1:1);}).slice(0,3);
  if(gol.length)h+=tarj('GOLEADORES','gol',gol.map(function(k){return fm(k,cu[k]+' goles');}).join(''));
  return {title:'Resumen del periodo '+per,right:tbtn('Cerrar','closeSheet',true),body:h+'</div>'};
}
function shInformeRival(sh){
  var nom=sh.rival,prev=partidosDelEquipoSel().filter(function(p){return coincideRival(p.nombreRival,nom);}).sort(function(a,b){return b.fecha-a.fecha;}),acc=[];
  prev.forEach(function(p){acc=acc.concat(p.acciones);});
  function tarj(t,i,c){return '<div class="glass panel stack10">'+etq(t,i)+c+'</div>';}
  var h='<div class="wrap stack" style="padding-top:6px">';
  if(!prev.length)return {title:'Informe: '+nom,right:tbtn('Cerrar','closeSheet',true),body:h+'<div class="glass panel f-foot sec">Todavía no hay partidos guardados contra '+esc(nom)+'.</div></div>'};
  h+=tarj('PARTIDOS ANTERIORES','historico',prev.map(function(p){var r=p.golesLocal>p.golesVisitante?['V','var(--green)']:p.golesLocal<p.golesVisitante?['D','var(--red)']:['E','var(--orange)'];
    return '<div class="row"><span class="f-cap" style="font-weight:800;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:'+r[1]+';flex:none">'+r[0]+'</span><span class="f-sub grow">'+new Date(p.fecha).toLocaleDateString(ES,{day:'numeric',month:'short',year:'numeric'})+'</span><span class="r b tn f-sub">'+p.golesLocal+' – '+p.golesVisitante+'</span></div>';}).join(''));
  var tiros=acc.filter(function(a){return a.tipo==='Defensa'&&['Gol','Parada','Fuera'].indexOf(a.resultado)>=0;});
  var mp={};tiros.forEach(function(a){if(a.dorsalRival==null)return;var l=mp[a.dorsalRival]||(mp[a.dorsalRival]={id:a.dorsalRival,t:0,g:0});l.t++;if(a.resultado==='Gol')l.g++;});
  var ls=Object.keys(mp).map(function(k){return mp[k];}).sort(function(a,b){return b.g-a.g||b.t-a.t;}).slice(0,5);
  if(ls.length)h+=tarj('SUS LANZADORES MÁS PELIGROSOS','rival',ls.map(function(l){return '<div class="row f-sub"><span class="b">#'+l.id+'</span><span class="grow"></span><span class="r tn">'+l.g+' goles / '+l.t+' tiros</span><span class="r b tn c-red" style="width:50px;text-align:right">'+pct0(l.t?l.g/l.t*100:0)+'</span></div>';}).join(''));
  function top(k){var c={};tiros.forEach(function(a){var v=a[k];if(v!=null&&v!=='')c[v]=(c[v]||0)+1;});return Object.keys(c).sort(function(a,b){return c[b]-c[a];}).slice(0,3).map(function(x){return [x,c[x]];});}
  var NZ={1:'arriba izquierda',2:'arriba centro',3:'arriba derecha',4:'medio izquierda',5:'centro',6:'medio derecha',7:'abajo izquierda',8:'abajo centro',9:'abajo derecha'};
  var zp=top('zonaDisparo');if(zp.length)h+=tarj('DESDE DÓNDE TIRAN MÁS','pista',zp.map(function(z){return fm(z[0],z[1]+' tiros');}).join(''));
  var zt=top('zonaPorteria');if(zt.length)h+=tarj('A QUÉ ZONA DE LA PORTERÍA','porteria',zt.map(function(z){return fm(NZ[z[0]]||'Zona '+z[0],z[1]+' tiros');}).join(''));
  var tl=top('tipoLanzamiento');if(tl.length)h+=tarj('CÓMO LANZAN','porteria',tl.map(function(z){return fm(z[0],z[1]+' tiros');}).join(''));
  var tr=parciales(acc,cat(prev[0].categoria).d);
  if(tr.length>1){var peo=null;tr.forEach(function(t){if(!peo||t.dif<peo.dif)peo=t;});
    h+=tarj('EN QUÉ TRAMOS NOS HACEN DAÑO','stats','<div class="f-sub">'+(peo&&peo.dif<0?'Donde más nos superan: el tramo '+peo.et+', con un parcial de '+peo.favor+'–'+peo.contra+' para nosotros sumando todos los partidos.':'Sin un tramo claro en el que nos superen.')+'</div>');}
  return {title:'Informe: '+nom,right:tbtn('Cerrar','closeSheet',true),body:h+'</div>'};
}

function analisisDefensivo(acc,seg,minT){
  var fil=filasDefensivas(acc,seg),of=acc.filter(function(a){return a.tipo===ACC_OF.tipo;});
  if(!fil.length&&!of.length)return '<div class="glass panel center stack8"><span style="display:inline-flex;width:34px;margin:0 auto" class="sec">'+ic('defensa')+'</span><div class="f-head">Todavía no hay acciones individuales</div><div class="f-foot sec">Se anotan desde Defensa → Acción defensiva (falta, robo, bloqueo, intercepción) y desde Ataque → Falta provocada.</div></div>';
  function tarj(t,i,c){return '<div class="glass panel stack10">'+etq(t,i)+c+'</div>';}
  function rank(t,i,col,lista,val,det){if(!lista.length)return tarj(t,i,'<div class="f-foot sec">Sin datos todavía.</div>');
    return tarj(t,i,lista.slice(0,5).map(function(x,k){return '<div class="row" style="gap:10px"><span class="r b f-foot" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,'+col+' 22%,transparent)">'+(k+1)+'</span><div class="grow" style="min-width:0"><div class="f-sub sb">'+esc(x.id)+'</div><div class="f-cap sec">'+esc(det(x))+'</div></div><span class="r blk f-title3" style="color:'+col+'">'+val(x)+'</span></div>';}).join(''));}
  var h='';
  if(fil.length){
    var tot=function(r){return acc.filter(function(a){return a.tipo===ACC_DEF.tipo&&a.resultado===r;}).length;};
    h+=tarj('ACCIONES DEFENSIVAS','defensa',ACC_DEF.ops.map(function(o){return fm(o.pl,String(tot(o.id)),o.c);}).join(''));
    h+=rank('LOS MÁS DUROS','alerta','var(--orange)',fil.filter(function(x){return x.duros>0;}).sort(function(a,b){return b.duros-a.duros;}),function(x){return x.duros;},function(x){return x.faltas+' faltas · '+x.excl+' exclusiones';});
    h+=rank('RECUPERACIONES','flame','var(--green)',fil.filter(function(x){return x.rec>0;}).sort(function(a,b){return b.rec-a.rec;}),function(x){return x.rec;},function(x){var r=por10(x,x.rec);return x.robos+' recuperaciones'+(x.inter?' · '+x.inter+' intercepciones':'')+(r!=null?' · '+r.toFixed(1).replace('.',',')+' por 10 min':'');});
    h+=rank('MUROS (BLOQUEOS)','parada','var(--blue)',fil.filter(function(x){return x.bloq>0;}).sort(function(a,b){return b.bloq-a.bloq;}),function(x){return x.bloq;},function(x){var r=por10(x,x.bloq);return r!=null?r.toFixed(1).replace('.',',')+' por 10 min':'bloqueos';});
    function cel(n,c){return '<span class="r b tn" style="width:42px;text-align:center;color:'+(n?c:'var(--label3)')+'">'+n+'</span>';}
    h+=tarj('TODOS LOS JUGADORES','equipo','<div class="row f-cap2 b sec"><span class="grow">Jugador</span><span style="width:42px;text-align:center">Falt.</span><span style="width:42px;text-align:center">Recup.</span><span style="width:42px;text-align:center">Bloq.</span><span style="width:42px;text-align:center">Inter.</span><span style="width:38px;text-align:center">Bal.</span></div>'+
      fil.slice().sort(function(a,b){return b.bal-a.bal;}).map(function(x){return '<div class="row f-foot"><span class="sb grow ell" style="min-width:0">'+esc(x.id)+'</span>'+cel(x.faltas,'var(--orange)')+cel(x.robos,'var(--green)')+cel(x.bloq,'var(--blue)')+cel(x.inter,'var(--purple)')+'<span class="r b tn" style="width:38px;text-align:center;color:'+(x.bal>=0?'var(--green)':'var(--red)')+'">'+signo(x.bal)+'</span></div>';}).join('')+
      '<div class="f-cap2 sec">Balance = robos + bloqueos + intercepciones − faltas.</div>');
    var pj=parejasDefensivas(acc,minT).sort(function(a,b){return a.pct-b.pct||b.pos-a.pos;});
    function fp(p,c){return '<div class="row"><div class="grow" style="min-width:0"><div class="f-sub sb">'+esc(p.nombres)+'</div><div class="f-cap sec">'+p.goles+' goles en '+p.tiros+' lanzamientos · '+p.pos+' acciones defensivas</div></div><span class="r blk f-title3" style="color:'+c+'">'+pct0(p.pct)+'</span></div>';}
    h+=tarj('PAREJAS DEFENSIVAS','person2',!pj.length?'<div class="f-foot sec">Aparecerán cuando una pareja haya defendido al menos '+minT+' lanzamientos juntos. Solo cuentan los partidos registrados con esta versión.</div>':
      '<div class="f-cap sec">De cada 100 lanzamientos rivales con la pareja en pista, cuántos acaban en gol.</div>'+pj.slice(0,5).map(function(p){return fp(p,'var(--green)');}).join('')+
      (pj.length>5?'<hr class="divider"><div class="f-cap b sec">Las que más sufren</div>'+pj.slice(-Math.min(3,pj.length-5)).reverse().map(function(p){return fp(p,'var(--red)');}).join(''):''));
  }
  if(of.length){var cu={};of.forEach(function(a){if(!a.jugadorNombre)return;var x=cu[a.jugadorNombre]||(cu[a.jugadorNombre]={id:a.jugadorNombre,f:0,s:0});if(a.resultado===ACC_OF.ops[1].id)x.s++;else x.f++;});
    var ls=Object.keys(cu).map(function(k){return cu[k];}).sort(function(a,b){return (b.f+b.s)-(a.f+a.s)||b.s-a.s;});
    h+=tarj('FALTAS PROVOCADAS (ATAQUE)','handTap',fm('Faltas provocadas',String(ls.reduce(function(t,x){return t+x.f;},0)),'var(--teal)')+fm('7 metros conseguidos',String(ls.reduce(function(t,x){return t+x.s;},0)),'var(--red)')+'<hr class="divider">'+
      ls.slice(0,5).map(function(x,k){return '<div class="row" style="gap:10px"><span class="r b f-foot" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--teal) 22%,transparent)">'+(k+1)+'</span><div class="grow"><div class="f-sub sb">'+esc(x.id)+'</div><div class="f-cap sec">'+x.f+' faltas · '+x.s+' siete metros</div></div><span class="r blk f-title3" style="color:var(--teal)">'+(x.f+x.s)+'</span></div>';}).join(''));}
  return h;
}

var Sync={activo:false,col:null,ultima:null,t:null,ultB:0,
  programar:function(){if(!Sync.col)return;clearTimeout(Sync.t);Sync.t=setTimeout(Sync.flush,1500);},
  flush:async function(){
    if(!Sync.col)return;
    try{
      if(syncDirty.eq){syncDirty.eq=false;await Sync.col.doc('equipos').set({lista:ST.equipos,u:ST.uEq||Date.now(),borrados:ST.borrados.slice(-800)});}
      var ids=Object.keys(syncDirty.p);syncDirty.p={};
      for(var i=0;i<ids.length;i++){var p=ST.partidos.find(function(x){return x.id===ids[i];});
        if(p)await Sync.col.doc('p_'+p.id).set({p:p,u:p.u||Date.now()});else await Sync.col.doc('p_'+ids[i]).delete();}
      if(syncDirty.b){if(Date.now()-Sync.ultB<10000){setTimeout(Sync.programar,10000);}else{syncDirty.b=false;Sync.ultB=Date.now();var b=lsGet('sh_borrador');
        if(b)await Sync.col.doc('borrador').set({b:b,u:b.guardadoEn||Date.now()});else await Sync.col.doc('borrador').delete();}}

    }

  init:async function(){
    if(!window.claude||!window.claude.use)return;

      var db=await window.claude.use('db'),us=await window.claude.use('user');if(!db||!us)return;
      var uid=await us.id();if(!uid)return;
      var col=db.collection('data/users/'+uid),snap=await col.get(),rEq=null,rP={},rB=null;
      snap.docs.forEach(function(d){var x=d.data();if(!x)return;if(d.id==='equipos')rEq=x;else if(d.id==='borrador')rB=x;else if(d.id.indexOf('p_')===0&&x.p)rP[x.p.id]=x;});
      var bor={};(ST.borrados||[]).concat(rEq&&rEq.borrados||[]).forEach(function(id){bor[id]=1;});ST.borrados=Object.keys(bor);
      if(rEq&&(rEq.u||0)>(ST.uEq||0)){ST.equipos=(rEq.lista||[]).map(normalizarEquipo);ST.uEq=rEq.u;if(F.equipoId&&!equipoActual())F.equipoId=null;}
      else if(ST.uEq||!rEq)syncDirty.eq=true;
      var loc={};ST.partidos.forEach(function(p){loc[p.id]=p;});
      Object.keys(rP).forEach(function(id){if(bor[id]){syncDirty.p[id]=1;return;}var l=loc[id];if(!l||(rP[id].u||0)>(l.u||0))loc[id]=normalizarPartido(rP[id].p),loc[id].u=rP[id].u;else if((l.u||0)>(rP[id].u||0))syncDirty.p[id]=1;});
      Object.keys(loc).forEach(function(id){if(!rP[id])syncDirty.p[id]=1;});
      ST.partidos=Object.keys(loc).filter(function(id){return !bor[id];}).map(function(id){return loc[id];});
      var lb=lsGet('sh_borrador');
      if(rB&&rB.b&&!M.activo&&(!lb||(rB.u||0)>(lb.guardadoEn||0))){lsSet('sh_borrador',rB.b);S.draft=rB.b;}
      else if(lb&&(!rB||(lb.guardadoEn||0)>(rB.u||0)))syncDirty.b=true;
      Sync.col=col;Sync.activo=true;Sync.ultima=Date.now();lsSet('sh_store',ST);render();Sync.flush();

var SANC_PEN={'Amarilla':.5,'2 Minutos':1.25,'Roja':3};

function puntosAccion(a){
  if(a.tipo==='Ataque')return a.resultado==='Gol'?{d:'a',p:1}:(a.resultado==='Parada'||a.resultado==='Fuera')?{d:'a',p:-.75}:a.resultado==='Pérdida'?{d:'a',p:-1}:null;
  if(a.tipo===ACC_OF.tipo){var o=ACC_OF.ops.find(function(x){return x.id===a.resultado;});return o?{d:'a',p:o.p}:null;}
  if(a.tipo===ACC_DEF.tipo){var od=ACC_DEF.ops.find(function(x){return x.id===a.resultado;}),p=od?od.p:ACC_DEF.antiguas[a.resultado];return p!=null?{d:'d',p:p*factorZona(a.zonaDefensiva)}:null;}
  if(a.tipo==='Sanción Disciplinaria'){var s=SANC_PEN[a.resultado];return s?{d:'d',p:-s}:null;}
  return null;
}
function claveAccion(a){return a.jugadorNombre?(a.jugadorId||a.jugadorNombre):null;}

  var m={};acc.forEach(function(a){var n=a.jugadorNombre,k=claveAccion(a);if(!k||n==='Banquillo'||n==='Mesa/Rival')return;var p=puntosAccion(a);if(!p)return;
    var v=m[k]||(m[k]={id:k,nombre:n,a:0,d:0});if(p.d==='a')v.a+=p.p;else v.d+=p.p;});
  return Object.keys(m).map(function(k){var v=m[k];v.t=v.a+v.d;return v;}).sort(function(x,y){return y.t-x.t;});
}

    if(!cuenta){signo=s;cuenta=1;}else if(s===signo)cuenta++;else break;if(cuenta>=lon)return signo;}
  return 0;}

      MM.mostrarAviso('Termina la exclusión de #'+e.jugador.dorsal+' '+e.jugador.nombre+': ENTRA #'+ent.dorsal+' '+ent.nombre+' (cambio programado).');M.retornoId=null;return;}}

};

    '<div class="row" style="gap:12px;margin:6px 0"><span class="f-sub sb grow center">'+esc(p.esLocal===false?p.nombreRival:p.nombreTuEquipo)+'</span><span class="sc">'+marcadorTexto(p)+'</span><span class="f-sub sb grow center">'+esc(p.esLocal===false?p.nombreTuEquipo:p.nombreRival)+'</span></div><div class="f-cap" style="opacity:.8">'+fechaCorta(p.fecha)+'</div></div><div class="cuerpo stack">';
  var gl={},tr={};p.acciones.forEach(function(a){if(a.tipo!=='Ataque'||['Gol','Parada','Fuera'].indexOf(a.resultado)<0)return;var k=a.jugadorNombre||'Sin asignar';tr[k]=(tr[k]||0)+1;if(a.resultado==='Gol')gl[k]=(gl[k]||0)+1;});
  function pc(g,t){return t?Math.round(g/t*100):0;}
  var gs=Object.keys(gl).map(function(k){return {n:k,g:gl[k],t:tr[k]};}).sort(function(a,b){return b.g-a.g||a.t-b.t;});

/* ---------- Niveles de uso (NivelesUso.swift) ---------- */
var NIVELES=[
  {id:'Básico',o:0,r:'Goles, paradas, fuera, pérdidas, cambios y exclusiones de 2 minutos. Lo mínimo para seguir el partido.'},
  {id:'Medio',o:1,r:'Añade tipo de lanzamiento, pasivo, faltas provocadas, tarjetas y titulares al empezar.'},
  {id:'Pro',o:2,r:'Todo: dorsal del rival, tiro sobre mi defensa, zona de las pérdidas y dictado por voz.'}];
var FUNCIONES=[
  {id:'titulares',t:'Titulares al empezar',n:1,i:'starter'},{id:'tipoLanzamiento',t:'Tipo de lanzamiento',n:1,i:'porteria'},
  {id:'pasivo',t:'Pasivo agotado',n:1,i:'timer'},{id:'faltaProvocada',t:'Falta provocada / 7 m',n:1,i:'handTap'},
  {id:'tarjetas',t:'Tarjetas',n:1,i:'tarjeta'},{id:'dorsalRival',t:'Dorsal del rival',n:2,i:'rival'},
  {id:'zonaDefensores',t:'Tiro sobre mi defensa',n:2,i:'shieldHalf'},{id:'zonaPerdida',t:'Zona de las pérdidas',n:2,i:'pin'},
  {id:'voz',t:'Dictado por voz',n:2,i:'mic'}];
var NivelUso={
  _n:null,_c:null,
  nivel:function(){if(!this._n){var v=lsGet('sh_nivel');this._n=NIVELES.find(function(x){return x.id===v;})||NIVELES[2];}return this._n;},
  cambios:function(){if(!this._c){var c=lsGet('sh_funciones');this._c=c&&typeof c==='object'?c:{};}return this._c;},
  activa:function(f){var c=this.cambios();if(c[f]!=null)return !!c[f];var d=FUNCIONES.find(function(x){return x.id===f;});return d?this.nivel().o>=d.n:true;},
  elegir:function(id){this._n=NIVELES.find(function(x){return x.id===id;})||NIVELES[2];this._c={};this.guardar();},
  poner:function(f,v){var d=FUNCIONES.find(function(x){return x.id===f;}),porNivel=this.nivel().o>=d.n,c=this.cambios();if(v===porNivel)delete c[f];else c[f]=v;this.guardar();},
  guardar:function(){lsSet('sh_nivel',this.nivel().id);lsSet('sh_funciones',this.cambios());
    /* Lo que se apaga aquí no puede seguir activo en los ajustes de cada partido */
    var t=false;if(!this.activa('voz')&&AJ.voz){AJ.voz=false;t=true;}if(!this.activa('tipoLanzamiento')&&AJ.anotarTipo){AJ.anotarTipo=false;t=true;}if(!this.activa('zonaPerdida')&&AJ.zonaPerdida){AJ.zonaPerdida=false;t=true;}
    if(!this.activa('dorsalRival'))F.modoDorsal=MODOS_DORSAL[0];if(t)guardarAjustes();}
};
function FN(f){return NivelUso.activa(f);}
function filaNivel(){var n=NivelUso.nivel();return '<button class="row press" style="width:100%;text-align:left;gap:12px" data-a="sheet" data-v="niveles">'+ins('sliders','var(--green)',34)+'<div class="grow"><div class="f-sub sb">Nivel de uso: '+n.id+'</div><div class="f-cap sec">Elige cuántos datos anotar y qué botones ver</div></div><span class="sec" style="display:inline-flex;width:16px">'+ic('chevR')+'</span></button><hr class="divider">';}
function shNiveles(){var n=NivelUso.nivel(),h='<div class="wrap form" style="padding-top:6px">';
  h+=fsec('Nivel de uso','sliders',NIVELES.map(function(x){var on=x.id===n.id;return '<button class="frow tap" style="gap:12px;text-align:left" data-a="nivElegir" data-v="'+x.id+'" aria-pressed="'+on+'"><span class="r blk" style="flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:'+(on?'var(--green)':'var(--gray)')+'">'+(x.o+1)+'</span><span class="grow"><span class="f-head" style="display:block">'+x.id+'</span><span class="f-cap sec">'+x.r+'</span></span>'+(on?'<span class="c-green" style="display:inline-flex;width:20px">'+ic('checkFill')+'</span>':'')+'</button>';}).join(''),'Empieza en Básico y sube cuando quieras anotar más datos.');
  h+=fsec('Funciones','grid',FUNCIONES.map(function(f){return '<div class="frow" style="gap:12px"><span class="c-acento" style="display:inline-flex;width:22px">'+ic(f.i)+'</span><span class="grow"><span class="f-sub sb" style="display:block">'+f.t+'</span><span class="f-cap2 sec">Desde nivel '+NIVELES[f.n].id+'</span></span>'+sw('fn-'+f.id,FN(f.id),'fnPoner',null,{'data-f':f.id})+'</div>';}).join(''),'Lo que apagues deja de aparecer en la pantalla del partido. Cambiar de nivel restablece estos interruptores.');
  return {title:'Nivel de uso',right:tbtn('Listo','closeSheet',true),body:h+'</div>'};}
/* Lo que el nivel apaga no aparece en el partido */
botonPasivo=(function(o){return function(l){return FN('pasivo')?o(l):'';};})(botonPasivo);
botonPasivoFlujo=(function(o){return function(at){return FN('pasivo')?o(at):'';};})(botonPasivoFlujo);
opcionesPP=(function(o){return function(j,f){return o(j,f).filter(function(x){
  if(x.o.k==='of'&&(x.o.a==='Falta provocada'||x.o.a==='7 metros provocado')&&!FN('faltaProvocada'))return false;
  if(x.o.k==='sancion'&&x.o.a!=='2 minutos'&&!FN('tarjetas'))return false;return true;});};})(opcionesPP);
preguntaDorsal=(function(o){return function(){return FN('dorsalRival')&&o();};})(preguntaDorsal);

function titularesValidos(){var c=convocados(),t=F.titulares||[];return c.filter(function(j){return t.indexOf(j.id)>=0;});}
function filaTitulares(){var n=titularesValidos().length;return '<hr class="divider"><button class="row press" style="width:100%;text-align:left;gap:12px" data-a="sheet" data-v="titulares">'+ins('starter','var(--green)',34)+'<div class="grow"><div class="f-sub sb">Titulares</div><div class="f-cap sec">'+(n?n+' elegidos · en sus posiciones habituales':'Automático (portero y primeros dorsales)')+'</div></div><span class="sec" style="display:inline-flex;width:16px">'+ic('chevR')+'</span></button>';}
function shTitulares(){var c=ordenAlin(convocados()),max=Math.min(7,c.length),t=F.titulares||[],sel=c.filter(function(j){return t.indexOf(j.id)>=0;}),hayP=sel.some(function(j){return j.posicion==='Portero';});

    (sel.length&&!hayP?'<div class="frow warn">'+ic('alerta')+'<span>Ningún portero entre los titulares.</span></div>':'')+

/* =====================================================================
   Licencia de uso (solo versión instalable)
   4 partidos de prueba. Después, «Renovar licencia» muestra el código de
   solicitud de este dispositivo; Juanma lo mete en su generador privado y
   devuelve un código de uso firmado, válido solo aquí y hasta la fecha que él elija.
   Los códigos antiguos por nombre siguen valiendo hasta que caduquen.
   ===================================================================== */
var CLAVE_PUBLICA={"kty":"EC","crv":"P-256","x":"HXviliLob1Ywi6BFEa2mNj0wCPk7EnHf35Uzbrj1Bqk","y":"HpsFL1JF_h7c25kjko1vJtP_4UzxvqWibpaa0B0R3tc"};
var PARTIDOS_PRUEBA=4;
var Licencia={
  datos:null,
  b64d:function(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;},
  extraer:function(txt){txt=String(txt||'').trim();var m=txt.match(/[#?&]c=([A-Za-z0-9_\-.]+)/);if(m)return m[1];return txt.replace(/\s+/g,'');},
  fin:function(e){return new Date(e+'T23:59:59').getTime();},
  fecha:function(iso){return new Date(iso+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});},
  /* Identificador de este dispositivo: 8 caracteres sin letras que se confundan */
  id:function(){var d=lsGet('sh_disp');if(typeof d!=='string'||!/^[2-9A-HJ-NP-Z]{8}$/.test(d)){var al='23456789ABCDEFGHJKMNPQRSTUVWXYZ',r=new Uint8Array(8);crypto.getRandomValues(r);d='';for(var i=0;i<8;i++)d+=al[r[i]%al.length];lsSet('sh_disp',d);}return d;},
  solicitud:function(){var d=Licencia.id();return 'SH-'+d.slice(0,4)+'-'+d.slice(4);},
  usos:function(){var l=lsGet('sh_usos');return Math.max(Array.isArray(l)?l.length:0,(ST.partidos||[]).length);},
  contar:function(id){var l=lsGet('sh_usos');if(!Array.isArray(l))l=[];if(l.indexOf(id)<0){l.push(id);lsSet('sh_usos',l);}},
  restantes:function(){return Math.max(0,PARTIDOS_PRUEBA-Licencia.usos());},
  vigente:function(){var d=Licencia.datos;return !!(d&&Date.now()<=Licencia.fin(d.e));},
  dias:function(){var d=Licencia.datos;return d?Math.ceil((Licencia.fin(d.e)-Date.now())/864e5):0;},
  puedeEmpezar:function(){return Licencia.vigente()||Licencia.restantes()>0;},
  verificar:async function(codigo){
    try{
      var p=codigo.split('.');if(p.length!==2)return {ok:false,motivo:'formato'};
      var key=await crypto.subtle.importKey('jwk',CLAVE_PUBLICA,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      var ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,Licencia.b64d(p[1]),new TextEncoder().encode(p[0]));
      if(!ok)return {ok:false,motivo:'firma'};
      var d=JSON.parse(new TextDecoder().decode(Licencia.b64d(p[0])));
      if(isNaN(Licencia.fin(d.e)))return {ok:false,motivo:'formato'};
      if(d.d&&d.d!==Licencia.id())return {ok:false,motivo:'otro',datos:d};
      if(Date.now()>Licencia.fin(d.e))return {ok:false,motivo:'caducado',datos:d};
      return {ok:true,datos:d};
    }catch(e){return {ok:false,motivo:'formato'};}
  },
  error:function(r){return r.motivo==='caducado'?'Ese código caducó el '+Licencia.fecha(r.datos.e)+'.':r.motivo==='otro'?'Ese código es de otro dispositivo. Envía tu código de solicitud, el que ves arriba.':'El código no es válido. Cópialo entero, tal como te lo enviaron.';},
  /* Al abrir: código del enlace (#c=…) o el guardado */
  cargar:async function(){
    var nuevo=Licencia.extraer(location.hash),guardado=lsGet('sh_acceso');
    if(nuevo&&nuevo.indexOf('.')>0){
      try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
      var r=await Licencia.verificar(nuevo);
      if(r.ok){lsSet('sh_acceso',nuevo);Licencia.datos=r.datos;render();toast('Licencia activada hasta el '+Licencia.fecha(r.datos.e));render();return;}
      Licencia.abrir(null,Licencia.error(r));
    }
    if(typeof guardado==='string'&&guardado){var g=await Licencia.verificar(guardado);if(g.ok||g.motivo==='caducado')Licencia.datos=g.datos||null;}
    render();
  },
  probar:async function(txt){
    var c=Licencia.extraer(txt);if(!c){Licencia.abrir(Licencia.motivo,'Escribe o pega el código de uso.');return;}
    var r=await Licencia.verificar(c);
    if(r.ok){lsSet('sh_acceso',c);Licencia.datos=r.datos;Licencia.cerrar();toast('Licencia activada hasta el '+Licencia.fecha(r.datos.e));render();return;}
    Licencia.abrir(Licencia.motivo,Licencia.error(r));
  },
  textoEstado:function(){
    if(Licencia.vigente())return 'Licencia válida hasta el '+Licencia.fecha(Licencia.datos.e)+(Licencia.datos.n?' ('+Licencia.datos.n+')':'')+'.';
    if(Licencia.datos)return 'Tu licencia terminó el '+Licencia.fecha(Licencia.datos.e)+'.';
    var q=Licencia.restantes();return q>0?'Versión de prueba: te quedan '+q+' de '+PARTIDOS_PRUEBA+' partidos.':'Has usado los '+PARTIDOS_PRUEBA+' partidos de prueba.';
  },

    if(Licencia.vigente())return e+' Si quieres ampliarla, envía tu código de solicitud.';
    return e+' Para seguir creando partidos necesitas un código de uso. Tus equipos y partidos siguen guardados y puedes consultarlos.';},
  compartir:function(){var t='Hola '+MARCA.autor.split(' ')[0]+', quiero '+(Licencia.datos?'renovar':'activar')+' la licencia de Si Handball. Mi código de solicitud es '+Licencia.solicitud()+'.';
    if(navigator.share){navigator.share({text:t}).catch(function(){});return;}location.href='https://wa.me/?text='+encodeURIComponent(t);},
  copiar:function(btn){var t=Licencia.solicitud();var ok=function(){btn.textContent='Copiado';setTimeout(function(){btn.textContent='Copiar';},1500);};try{navigator.clipboard.writeText(t).then(ok,function(){});}catch(e){}},
  abrir:function(motivo,err){
    Licencia.motivo=motivo||null;
    var el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';document.body.appendChild(el);}
    el.innerHTML='<div class="gate" role="dialog" aria-modal="true" aria-label="Renovar licencia">'+amb()+'<div class="wrap col" style="position:relative;z-index:1;align-items:center;gap:14px;text-align:center;max-width:440px;max-height:100%;overflow-y:auto;padding-top:14px;padding-bottom:14px">'+logo(84)+
      '<div class="r blk" style="font-size:28px">Renovar licencia</div><div class="sec f-sub">'+esc(Licencia.mensaje())+'</div>'+
      '<div class="glass panel stack10" style="width:100%;box-sizing:border-box"><div class="etq" style="justify-content:center">TU CÓDIGO DE SOLICITUD</div><div class="r blk mono" style="font-size:26px;letter-spacing:2px;user-select:all">'+Licencia.solicitud()+'</div>'+
      '<div class="row" style="gap:8px"><button class="btn gl glass grow" id="lic-copy">Copiar</button><button class="btn prom grow" style="--tint:var(--green)" id="lic-share">Enviar</button></div><div class="f-cap sec">Envíaselo a '+esc(MARCA.autor)+'. Te devolverá un código de uso para este dispositivo.</div></div>'+
      '<input class="tf center" id="gate-in" placeholder="Pega aquí el código de uso o el enlace" autocomplete="off" autocapitalize="off" spellcheck="false">'+
      (err?'<div class="f-foot" style="color:var(--red)">'+esc(err)+'</div>':'')+
      (navigator.clipboard&&navigator.clipboard.readText?'<button class="btn gl glass lg wfull" id="gate-paste">Pegar código copiado</button>':'')+'<button class="btn prom lg wfull" id="gate-ok">Activar</button><button class="btn gl glass lg wfull" id="lic-cerrar">Volver</button><div class="f-cap2 ter">'+copyright()+'</div></div></div>';
    var go=function(){Licencia.probar(document.getElementById('gate-in').value);};
    document.getElementById('gate-ok').onclick=go;
    document.getElementById('lic-cerrar').onclick=Licencia.cerrar;
    document.getElementById('lic-share').onclick=Licencia.compartir;
    document.getElementById('lic-copy').onclick=function(){Licencia.copiar(this);};
    var ps=document.getElementById('gate-paste');if(ps)ps.onclick=function(){navigator.clipboard.readText().then(function(t){document.getElementById('gate-in').value=t;Licencia.probar(t);},function(){document.getElementById('gate-in').focus();});};
    document.getElementById('gate-in').onkeydown=function(e){if(e.key==='Enter')go();};
  },
  cerrar:function(){var el=document.getElementById('gate');if(el)el.remove();},
  /* Aviso en la pantalla de inicio */
  avisoInicio:function(){
    if(Licencia.vigente()){var d=Licencia.dias();return d<=10?'<button class="glass panel p12 tint row press" style="--tinte:var(--orange);gap:10px;width:100%;text-align:left" data-a="licencia">'+ins('key','var(--orange)',34)+'<span class="f-foot sb grow">Tu licencia caduca '+(d<=1?'hoy':'en '+d+' días')+'. Toca para renovarla.</span></button>':'';}
    var q=Licencia.restantes();
    if(q>0&&!Licencia.datos)return '<div class="f-cap sec center row" style="gap:6px;justify-content:center">'+ic('key')+'Versión de prueba: te quedan '+q+' de '+PARTIDOS_PRUEBA+' partidos</div>';
    return '<button class="glass panel p12 tint row press" style="--tinte:var(--red);gap:10px;width:100%;text-align:left" data-a="licencia">'+ins('key','var(--red)',34)+'<span class="grow"><span class="f-sub b" style="display:block">'+(Licencia.datos?'Tu licencia ha caducado':'Has usado los '+PARTIDOS_PRUEBA+' partidos de prueba')+'</span><span class="f-cap sec">Toca para renovar la licencia</span></span></button>';
  },
  resumenAjustes:function(){
    return '<div class="frow"><span class="grow f-foot">'+esc(Licencia.textoEstado())+'</span></div><div class="frow"><span class="grow">Código de solicitud</span><span class="mono b">'+Licencia.solicitud()+'</span></div><button class="frow btnrow tap" data-a="licencia">'+ic('key')+'<span>Renovar licencia</span></button>';
  }
};
Licencia.id();
Licencia.cargar();

if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
</script>
